name: PlatformIO CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  native-tests:
    name: Native Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Cache PlatformIO packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'sdkconfig.defaults', 'default_16MB.csv') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Run native tests
        run: pio test -e native

      - name: Check setup and packaging scripts
        run: |
          bash -n install.sh
          bash install.sh --check
          python -m py_compile scripts/package_release.py

  firmware-build:
    name: ESP32-P4 ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment: [esp32p4-release, esp32p4-debug, esp32p4-mirror]
    runs-on: ubuntu-latest
    needs: native-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Cache PlatformIO packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'sdkconfig.defaults', 'default_16MB.csv') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Build firmware variant
        run: pio run -e ${{ matrix.environment }}

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: tig-rotator-${{ matrix.environment }}
          path: |
            .pio/build-fw/${{ matrix.environment }}/*.bin
            .pio/build-fw/${{ matrix.environment }}/*.elf
          if-no-files-found: error

  simulator:
    name: LVGL navigation regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          pip install platformio
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev ninja-build xvfb
          pio pkg install -e esp32p4-release
      - name: Build simulator
        run: |
          cmake -S simulator -B simulator/build -G Ninja
          cmake --build simulator/build --target rotator_simulator
      - name: Test actual UI navigation
        run: xvfb-run -a simulator/build/rotator_simulator --self-test
