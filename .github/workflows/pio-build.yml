name: PlatformIO CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  static-analysis:
    name: Static analysis
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Prove cppcheck reads the firmware source
        run: |
          echo 'int cppcheck_probe() { int a[2]; return a[2]; }' > src/cppcheck_probe.cpp
          if pio check -e static-analysis --severity=high --severity=medium --fail-on-defect=high --fail-on-defect=medium; then
            echo "cppcheck missed a known defect, so a pass would mean nothing"
            exit 1
          fi
          mv src/cppcheck_probe.cpp "$RUNNER_TEMP/"
      - name: Run cppcheck on the firmware source
        run: pio check -e static-analysis --severity=high --severity=medium --fail-on-defect=high --fail-on-defect=medium

  native-tests:
    name: Native Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements-dev.txt

      - name: Cache PlatformIO packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('requirements-dev.txt', 'test/test_custom_runner.py', 'platformio.ini', 'default_16MB.csv') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Run native tests
        run: pio test -e native -e native-control -e native-speed -e native-storage -e native-safety -e native-control-storage

      - name: Check setup and packaging scripts
        run: |
          bash -n install.sh
          bash install.sh --check
          python -m py_compile scripts/package_release.py scripts/package_simulator.py
          python -m unittest discover -s test/tooling -v

  firmware-build:
    name: ${{ matrix.environment == 'esp32p4-release' && 'ESP32-P4 Release Build' || format('ESP32-P4 {0}', matrix.environment) }}
    strategy:
      fail-fast: false
      matrix:
        environment: [esp32p4-release, esp32p4-debug, esp32p4-mirror]
    runs-on: ubuntu-latest
    needs: native-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements-dev.txt

      - name: Cache PlatformIO packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('requirements-dev.txt', 'test/test_custom_runner.py', 'platformio.ini', 'default_16MB.csv') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Build firmware variant
        run: pio run -e ${{ matrix.environment }}

      - name: Upload firmware artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tig-rotator-${{ matrix.environment }}
          path: |
            .pio/build-fw/${{ matrix.environment }}/*.bin
            .pio/build-fw/${{ matrix.environment }}/*.elf
          if-no-files-found: error

  simulator:
    name: LVGL navigation regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev ninja-build xvfb
          pio pkg install -e esp32p4-release
      - name: Build simulator
        run: |
          cmake -S simulator -B simulator/build -G Ninja
          cmake --build simulator/build --target rotator_simulator
      - name: Test actual UI navigation
        run: |
          python scripts/test_fas_rmt.py
          xvfb-run -a simulator/build/rotator_simulator --self-test
          xvfb-run -a simulator/build/rotator_simulator --audit-layout

  simulator-windows:
    name: Portable Windows simulator
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Load pinned UI libraries
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          python -m pip install -r requirements-dev.txt
          pio pkg install -e esp32p4-release
          $simToolchain = Join-Path $env:MSYS2_LOCATION 'ucrt64'
          (Join-Path $simToolchain 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "SIM_TOOLCHAIN=$simToolchain" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Windows simulator
        run: |
          cmake -S simulator -B simulator/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ "-DSIMULATOR_DEPENDENCY_ROOT=$env:SIM_TOOLCHAIN"
          if ($LASTEXITCODE -ne 0) { throw 'Simulator configure failed' }
          cmake --build simulator/build --target rotator_simulator
          if ($LASTEXITCODE -ne 0) { throw 'Simulator build failed' }
      - name: Test and package exact binary
        run: |
          python scripts/test_fas_rmt.py
          if ($LASTEXITCODE -ne 0) { throw 'FastAccelStepper RMT regression failed' }
          & simulator/build/rotator_simulator.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Simulator self-test failed' }
          & simulator/build/rotator_simulator.exe --audit-layout
          if ($LASTEXITCODE -ne 0) { throw 'Simulator layout audit failed' }
          python scripts/package_simulator.py --output release-simulator --toolchain "$env:SIM_TOOLCHAIN"
          if ($LASTEXITCODE -ne 0) { throw 'Simulator package failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tig-rotator-simulator-windows-x64
          path: release-simulator/*.zip*
          if-no-files-found: error
