name: Release Firmware

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to build and publish
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Package Validated Firmware and Publish
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Check version and release notes
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git rev-parse "refs/tags/$RELEASE_TAG"
          grep -F "#define FW_VERSION \"$RELEASE_TAG\"" src/config.h
          test -f "docs/releases/$RELEASE_TAG.md"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Require successful CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse HEAD)"
          CI_RUN_ID="$(gh run list --workflow pio-build.yml --branch master --commit "$COMMIT" \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          test -n "$CI_RUN_ID"
          test "$(gh run view "$CI_RUN_ID" --json jobs --jq 'all(.jobs[]; .conclusion == "success")')" = true
          echo "CI_RUN_ID=$CI_RUN_ID" >> "$GITHUB_ENV"
          echo "CI_RUN_URL=https://github.com/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" >> "$GITHUB_ENV"
          gh run download "$CI_RUN_ID" --dir ci-artifacts
          for ENVIRONMENT in esp32p4-release esp32p4-debug esp32p4-mirror; do
            mkdir -p ".pio/build-fw/$ENVIRONMENT"
            cp "ci-artifacts/tig-rotator-$ENVIRONMENT/"*.bin ".pio/build-fw/$ENVIRONMENT/"
          done

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Cache PlatformIO packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('requirements-dev.txt', 'test/test_custom_runner.py', 'platformio.ini', 'sdkconfig.defaults', 'default_16MB.csv') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Load pinned license and OTA initialization files
        run: pio pkg install -e esp32p4-release

      - name: Prepare firmware bundles and checksums
        run: |
          python scripts/package_release.py --version "$RELEASE_TAG" --output release \
            --run-url "$CI_RUN_URL"
          (cd ci-artifacts/tig-rotator-simulator-windows-x64 && sha256sum -c *.zip.sha256)
          cp ci-artifacts/tig-rotator-simulator-windows-x64/*.zip* release/
          python - <<'PY'
          import hashlib
          from pathlib import Path
          directory = Path('release')
          entries = sorted(p for p in directory.iterdir() if p.is_file() and p.name != 'SHA256SUMS.txt')
          (directory / 'SHA256SUMS.txt').write_text(''.join(
              hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in entries), encoding='utf-8')
          PY

      - name: Save build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: welding-positioner-${{ env.RELEASE_TAG }}
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG â€” Welding Positioner Controller" \
              --notes-file "docs/releases/$RELEASE_TAG.md" --draft=false --latest
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --latest \
              --title "$RELEASE_TAG â€” Welding Positioner Controller" \
              --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
