; GENERATED by benchtop firmware.ts from project.json.
; Regenerated on every run: change libs and board in project.json, not here.

[platformio]
default_envs = main

; Shared by both environments.
[env]
; ESP32-P4, C5 and C61 are not in the registry's espressif32 (8.0.0 has no such board:
; "Unknown board ID"), so this is pioarduino's fork, pinned to a git tag. 55.03.312-1
; (Arduino core 3.3.12) is the tag a working ESP32-P4 Arduino project builds with, checked
; 2026-11-15. C5 and C61 boards are listed in it but were not built. Bump it deliberately
; and rebuild both envs.
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.312-1
board = esp32-p4
framework = arduino
monitor_speed = 115200

; The real firmware: src/main.cpp.
[env:main]
build_src_filter = +<*> -<bringup.cpp>
lib_deps =
  gin66/FastAccelStepper

; Bring-up sketch: proves wiring before the real firmware exists. Needs no libraries.
[env:bringup]
build_src_filter = +<*> -<main.cpp>
