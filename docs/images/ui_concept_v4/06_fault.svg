<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480"><title>Fault state</title><g font-family="Bahnschrift, Segoe UI, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#E9E8E1"/><rect x="0" y="0" width="800" height="68" rx="0" fill="#162C32"/><text x="24" y="28" font-size="22" font-weight="700" fill="#F9F8F2">ARC / 04</text><text x="24" y="49" font-size="11" font-weight="600" fill="#C7CEC9">WELDING POSITIONER</text><text x="240" y="41" font-size="22" font-weight="500" fill="#F9F8F2">Motion blocked</text><rect x="648" y="16" width="128" height="36" rx="8" fill="#D7E88B"/><text x="664" y="40" font-size="15" font-weight="700" fill="#162C32">STOPED</text><rect x="24" y="92" width="752" height="92" rx="8" fill="#AB302D"/><text x="44" y="133" font-size="30" font-weight="700" fill="#F9F8F2">EMERGENCY STOP</text><text x="44" y="163" font-size="18" font-weight="400" fill="#F9F8F2">Controller motor output is disabled.</text><text x="24" y="228" font-size="25" font-weight="700" fill="#086C65">1</text><text x="64" y="228" font-size="22" font-weight="500" fill="#162C32">Check the machine and clear the cause.</text><text x="24" y="284" font-size="25" font-weight="700" fill="#086C65">2</text><text x="64" y="284" font-size="22" font-weight="500" fill="#162C32">Release the physical E-STOP button.</text><text x="24" y="340" font-size="25" font-weight="700" fill="#086C65">3</text><text x="64" y="340" font-size="22" font-weight="500" fill="#162C32">Reset when inputs are clear.</text><rect x="0" y="400" width="800" height="80" rx="0" fill="#F9F8F2"/><text x="24" y="433" font-size="14" font-weight="700" fill="#AB302D">WAITING FOR E-STOP INPUT</text><text x="24" y="456" font-size="15" font-weight="400" fill="#526268">Reset never starts the motor.</text><rect x="472" y="412" width="304" height="56" rx="8" fill="#C7CEC9"/><text x="490" y="447" font-size="18" font-weight="600" fill="#526268">RESET BLOCKED</text></g></svg>