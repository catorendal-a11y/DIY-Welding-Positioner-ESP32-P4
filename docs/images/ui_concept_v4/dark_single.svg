<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
<title>ARC — Dark operator screen</title>
<defs>
 <radialGradient id="dial"><stop stop-color="#172838"/><stop offset="1" stop-color="#0B1119"/></radialGradient>
 <linearGradient id="start" x2="1" y2="1"><stop stop-color="#70ECFF"/><stop offset="1" stop-color="#369CFF"/></linearGradient>
 <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#344251"/></pattern>
</defs>
<rect width="800" height="480" fill="#080C12"/>
