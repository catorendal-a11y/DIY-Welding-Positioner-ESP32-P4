 <text x="477" y="255" fill="#EDF4FC" font-size="37" font-weight="500">471</text>
 <text x="554" y="253" fill="#9EB1C3" font-size="16">mm/min</text>
 <text x="478" y="278" fill="#718499" font-size="12">Calculated · Ø 300 mm workpiece</text>
 <rect x="478" y="300" width="296" height="76" rx="4" fill="#121E2B"/>
