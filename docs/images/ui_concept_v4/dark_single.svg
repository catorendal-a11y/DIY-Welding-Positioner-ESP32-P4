 <circle cx="228" cy="125" r="7" fill="#B2F4FF"/>
 <text x="228" y="195" text-anchor="middle" fill="#8DADC0" font-size="12" letter-spacing="3">TARGET SPEED</text>
 <text x="228" y="267" text-anchor="middle" fill="#F1F7FF" font-size="72" font-weight="600" letter-spacing="-3">0.500</text>
