 <text x="122" y="349" fill="#718499" font-size="12">0.00</text>
 <text x="300" y="349" fill="#718499" font-size="12">1.00</text>
 <path d="M181 355H275" stroke="#344454"/>
 <text x="228" y="380" text-anchor="middle" fill="#B3C5D4" font-size="13">PANEL DIAL ACTIVE</text>

 <text x="478" y="103" fill="#66DFFF" font-size="11" letter-spacing="2">OPERATING MODE</text>
 <text x="476" y="144" fill="#F1F7FF" font-size="34" font-weight="600">Continuous</text>
 <text x="478" y="168" fill="#8C9DAF" font-size="14">Manual rotation · no auto-stop</text>
 <path d="M478 189H774" stroke="#253340"/>
