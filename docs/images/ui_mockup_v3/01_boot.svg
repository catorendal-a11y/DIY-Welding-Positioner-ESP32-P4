<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Startup checks</title><desc id="desc">Proposed real readiness checks, not a timed progress animation. UI design proposal, not live machine data.</desc><g font-family="Bahnschrift, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#101316"/><rect x="0" y="0" width="5" height="66" rx="0" fill="#FFA640"/><text x="24" y="27" font-size="12" fill="#AEB8BF" font-weight="600" text-anchor="start">POWER-ON CHECK</text><text x="24" y="54" font-size="25" fill="#F4F2EC" font-weight="600" text-anchor="start">TIG / ROTATOR</text><rect x="638" y="21" width="138" height="30" rx="15" fill="#1B2025" stroke="#39434B"/><circle cx="653" cy="36" r="4" fill="#FFA640"/><text x="666" y="42" font-size="14" fill="#FFA640" font-weight="600" text-anchor="start">CHECKING</text><path d="M24,70 L776,70" fill="none" stroke="#39434B" stroke-width="1"/><text x="24" y="130" font-size="38" fill="#F4F2EC" font-weight="600" text-anchor="start">Ready for</text><text x="24" y="176" font-size="38" fill="#F4F2EC" font-weight="600" text-anchor="start">the next weld.</text><text x="24" y="219" font-size="19" fill="#AEB8BF" font-weight="400" text-anchor="start">Motor output stays disabled</text><text x="24" y="246" font-size="19" fill="#AEB8BF" font-weight="400" text-anchor="start">until startup checks complete.</text><text x="24" y="318" font-size="14" fill="#AEB8BF" font-weight="600" text-anchor="start">CONTROLLER v2.0.9</text><rect x="24" y="344" width="330" height="8" rx="4" fill="#252C32"/><rect x="24" y="344" width="234.29999999999998" height="8" rx="4" fill="#FFA640"/><text x="24" y="376" font-size="16" fill="#AEB8BF" font-weight="400" text-anchor="start">5 / 7 checks complete</text><text x="410" y="121" font-size="18" fill="#F4F2EC" font-weight="400" text-anchor="start">Display &amp; touch</text><text x="754" y="121" font-size="15" fill="#8CE0B0" font-weight="600" text-anchor="end">OK</text><path d="M410,135 L776,135" fill="none" stroke="#39434B" stroke-width="1"/><text x="410" y="177" font-size="18" fill="#F4F2EC" font-weight="400" text-anchor="start">Saved settings</text><text x="754" y="177" font-size="15" fill="#8CE0B0" font-weight="600" text-anchor="end">OK</text><path d="M410,191 L776,191" fill="none" stroke="#39434B" stroke-width="1"/><text x="410" y="233" font-size="18" fill="#F4F2EC" font-weight="400" text-anchor="start">Motor interface</text><text x="754" y="233" font-size="15" fill="#8CE0B0" font-weight="600" text-anchor="end">OK</text><path d="M410,247 L776,247" fill="none" stroke="#39434B" stroke-width="1"/><text x="410" y="289" font-size="18" fill="#F4F2EC" font-weight="400" text-anchor="start">Safety inputs</text><text x="754" y="289" font-size="15" fill="#FFA640" font-weight="600" text-anchor="end">CHECK</text><path d="M410,303 L776,303" fill="none" stroke="#39434B" stroke-width="1"/><text x="410" y="345" font-size="18" fill="#F4F2EC" font-weight="400" text-anchor="start">Pedal released</text><text x="754" y="345" font-size="15" fill="#FFA640" font-weight="600" text-anchor="end">WAIT</text><path d="M410,359 L776,359" fill="none" stroke="#39434B" stroke-width="1"/><text x="24" y="449" font-size="14" fill="#AEB8BF" font-weight="600" text-anchor="start">MOTOR DISABLED</text><text x="776" y="449" font-size="16" fill="#AEB8BF" font-weight="400" text-anchor="end">Do not press the pedal during startup</text></g></svg>