<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Main / rotating</title><desc id="desc">Running variant: calculated speed and elapsed time, fixed STOP position. UI design proposal, not live machine data.</desc><g font-family="Bahnschrift, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#101316"/><rect x="0" y="0" width="5" height="66" rx="0" fill="#FFA640"/><text x="24" y="27" font-size="12" fill="#AEB8BF" font-weight="600" text-anchor="start">OPERATION / CONTINUOUS</text><text x="24" y="54" font-size="25" fill="#F4F2EC" font-weight="600" text-anchor="start">Continuous rotation</text><rect x="638" y="21" width="138" height="30" rx="15" fill="#1B2025" stroke="#39434B"/><circle cx="653" cy="36" r="4" fill="#FFA640"/><text x="666" y="42" font-size="14" fill="#FFA640" font-weight="600" text-anchor="start">ROTATING</text><path d="M24,70 L776,70" fill="none" stroke="#39434B" stroke-width="1"/><text x="24" y="107" font-size="14" fill="#AEB8BF" font-weight="600" text-anchor="start">CALCULATED SPEED</text><text x="20" y="218" font-size="104" fill="#F4F2EC" font-weight="600" text-anchor="start">0.80</text><text x="291" y="215" font-size="25" fill="#AEB8BF" font-weight="400" text-anchor="start">RPM</text><rect x="24" y="243" width="368" height="8" rx="4" fill="#252C32"/><rect x="24" y="243" width="98.13333333333333" height="8" rx="4" fill="#FFA640"/><text x="24" y="280" font-size="15" fill="#AEB8BF" font-weight="400" text-anchor="start">0.001</text><text x="392" y="280" font-size="15" fill="#AEB8BF" font-weight="400" text-anchor="end">3.000 RPM</text><rect x="24" y="301" width="368" height="73" rx="10" fill="#1B2025"/><text x="40" y="325" font-size="14" fill="#AEB8BF" font-weight="600" text-anchor="start">SURFACE SPEED / Ø 300 mm</text><text x="40" y="359" font-size="30" fill="#F4F2EC" font-weight="600" text-anchor="start">754</text><text x="118" y="359" font-size="18" fill="#AEB8BF" font-weight="400" text-anchor="start">mm/min</text><rect x="424" y="94" width="352" height="280" rx="10" fill="#1B2025"/><text x="444" y="121" font-size="14" fill="#AEB8BF" font-weight="600" text-anchor="start">CONTROL SOURCE</text><text x="444" y="153" font-size="24" fill="#FFA640" font-weight="600" text-anchor="start">Panel dial</text><path d="M444,174 L756,174" fill="none" stroke="#39434B" stroke-width="1"/><text x="444" y="204" font-size="14" fill="#AEB8BF" font-weight="600" text-anchor="start">DIRECTION</text><text x="756" y="205" font-size="24" fill="#F4F2EC" font-weight="400" text-anchor="end">CW  ↻</text><text x="444" y="248" font-size="14" fill="#AEB8BF" font-weight="600" text-anchor="start">PROGRAM</text><text x="756" y="249" font-size="20" fill="#F4F2EC" font-weight="400" text-anchor="end">Manual</text><text x="444" y="292" font-size="14" fill="#AEB8BF" font-weight="600" text-anchor="start">ELAPSED</text><text x="756" y="293" font-size="20" fill="#F4F2EC" font-weight="400" text-anchor="end">00:42</text><text x="444" y="349" font-size="16" fill="#AEB8BF" font-weight="400" text-anchor="start">Stop before changing setup</text><path d="M24,392 L776,392" fill="none" stroke="#39434B" stroke-width="1"/><rect x="24" y="408" width="152" height="56" rx="8" fill="#252C32" stroke="#39434B"/><text x="100.0" y="443.0" font-size="19" fill="#F4F2EC" font-weight="600" text-anchor="middle">&lt;  MENU</text><rect x="192" y="408" width="272" height="56" rx="8" fill="#252C32" stroke="#39434B"/><text x="328.0" y="443.0" font-size="19" fill="#F4F2EC" font-weight="600" text-anchor="middle">0.80 RPM SET</text><rect x="480" y="408" width="296" height="56" rx="8" fill="#3B2025" stroke="#FF7272"/><text x="628.0" y="443.0" font-size="19" fill="#FF7272" font-weight="600" text-anchor="middle">STOP</text></g></svg>