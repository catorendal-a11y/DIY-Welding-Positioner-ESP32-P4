<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Navigation menu</title><desc id="desc">Four clear destinations with fixed return to the main operating screen. UI design proposal, not live machine data.</desc><g font-family="Bahnschrift, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#101316"/><rect x="0" y="0" width="5" height="66" rx="0" fill="#FFA640"/><text x="24" y="27" font-size="12" fill="#AEB8BF" font-weight="600" text-anchor="start">NAVIGATION</text><text x="24" y="54" font-size="25" fill="#F4F2EC" font-weight="600" text-anchor="start">Menu</text><rect x="638" y="21" width="138" height="30" rx="15" fill="#1B2025" stroke="#39434B"/><circle cx="653" cy="36" r="4" fill="#8CE0B0"/><text x="666" y="42" font-size="14" fill="#8CE0B0" font-weight="600" text-anchor="start">READY</text><path d="M24,70 L776,70" fill="none" stroke="#39434B" stroke-width="1"/><rect x="24" y="94" width="368" height="122" rx="10" fill="#1B2025" stroke="#39434B"/><text x="42" y="125" font-size="14" fill="#FFA640" font-weight="600" text-anchor="start">01</text><text x="42" y="159" font-size="25" fill="#F4F2EC" font-weight="600" text-anchor="start">Run modes</text><text x="42" y="191" font-size="17" fill="#AEB8BF" font-weight="400" text-anchor="start">Pulse · Step · Jog · Countdown</text><text x="364" y="130" font-size="24" fill="#FFA640" font-weight="400" text-anchor="start">↗</text><rect x="408" y="94" width="368" height="122" rx="10" fill="#1B2025" stroke="#39434B"/><text x="426" y="125" font-size="14" fill="#FFA640" font-weight="600" text-anchor="start">02</text><text x="426" y="159" font-size="25" fill="#F4F2EC" font-weight="600" text-anchor="start">Programs</text><text x="426" y="191" font-size="17" fill="#AEB8BF" font-weight="400" text-anchor="start">Save and repeat your setup</text><text x="748" y="130" font-size="24" fill="#FFA640" font-weight="400" t