<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Jog / hold to move</title><desc id="desc">Separated direction pads, slow speed control, prominent release-to-stop instruction. UI design proposal, not live machine data.</desc><g font-family="Bahnschrift, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#101316"/><rect x="0" y="0" width="5" height="66" rx="0" fill="#FFA640"/><text x="24" y="27" font-size="12" fill="#AEB8BF" font-weight="600" text-anchor="start">OPERATION / MANUAL MOTION</text><text x="24" y="54" font-size="25" fill="#F4F2EC" font-weight="600" text-anchor="start">Jog</text><rect x="638" y="21" width="138" height="30" rx="15" fill="#1B2025" stroke="#39434B"/><circle cx="653" cy="36" r="4" fill="#8CE0B0"/><text x="666" y="42" font-size="14" fill="#8CE0B0" font-weight="600" text-anchor="start">READY</text><path d="M24,70 L776,70" fill="none" stroke="#39434B" stroke-width="1"/><rect x="24" y="94" width="304" height="82" rx="10" fill="#1B2025" stroke="#39434B"/><text x="40" y="118" font-size="14" fill="#AEB8BF" font-weight="600" text-anchor="start">JOG SPEED</text><text x="40" y="156" font-size="30" fill="#F4F2EC" font-weight="600" text-anchor="start">0.20</text><text x="312" y="155" font-size="16" fill="#AEB8BF" font-weight="400" text-anchor="end">RPM</text><rect x="344" y="94" width="88" height="82" rx="8" fill="#252C32" stroke="#39434B"/><text x="388.0" y="142.0" font-size="19" fill="#F4F2EC" font-weight="600" text-anchor="middle">−</text><rect x="448" y="94" width="88" height="82" rx="8" fill="#252C32" stroke="#39434B"/><text x="492.0" y="142.0" font-size="19" fill="#F4F2EC" font-weight="600" text-anchor="middle">+</text><text x="568" y="128" font-size="16" fill="#FFA640" font-weight="600" text-anchor="start">RELEASE</text><text x="568" y="155" font-size="21" fill="#F4F2EC" font-weight="600" text-anchor="start">TO STOP</text><rect x="24" y="196" width="368" height="126" rx="8" fill="#252C32" stroke="#39434B"/><text x="208.0" y="266.0" font-size="19" fill="#F4F2EC" font-weight="600" text-anchor="middle">↶  HOLD CCW</text><rect x="408" y="196" width="368" height="126" rx="8" fill="#393024" stroke="#FFA640"/><text x="592.0" y="266.0" font-size="19" fill="#FFA640" font-weight="600" text-anchor="middle">HOLD CW  ↷</text><text x="24" y="363" font-size="19" fill="#AEB8BF" font-weight="400" text-anchor="start">Motion lasts only while you hold a direction button.</text><path d="M24,392 L776,392" fill="none" stroke="#39434B" stroke-width="1"/><rect x="24" y="408" width="152" height="56" rx="8" fill="#252C32" stroke="#39434B"/><text x="100.0" y="443.0" font-size="19" fill="#F4F2EC" font-weight="600" text-anchor="middle">&lt;  MODES</text><rect x="496" y="408" width="280" height="56" rx="8" fill="#3B2025" stroke="#FF7272"/><text x="636.0" y="443.0" font-size="19" fill="#FF7272" font-weight="600" text-anchor="middle">STOP</text></g></svg>