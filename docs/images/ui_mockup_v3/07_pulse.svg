<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Pulse setup</title><desc id="desc">Readable timing blocks with an explanatory cycle preview. UI design proposal, not live machine data.</desc><g font-family="Bahnschrift, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#101316"/><rect x="0" y="0" width="5" height="66" rx="0" fill="#FFA640"/><text x="24" y="27" font-size="12" fill="#AEB8BF" font-weight="600" text-anchor="start">OPERATION / PULSE</text><text x="24" y="54" font-size="25" fill="#F4F2EC" font-weight="600" text-anchor="start">Pulse rotation</text><rect x="638" y="21" width="138" height="30" rx="15" fill="#1B2025" stroke="#39434B"/><circle cx="653" cy="36" r="4" fill="#8CE0B0"/><text x="666" y="42" font-size="14" fill="#8CE0B0" font-weight="600" text-anchor="start">READY</text><path d="M24,70 L776,70" fill="none" stroke="#39434B" stroke-width="1"/><rect x="24" y="94" width="232" height="82" rx="10" fill="#1B2025" stroke="#FFA640"/><text x="40" y="118" font-size="14" fill="#AEB8BF" font-weight="600" text-anchor="start">ROTATE FOR</text><text x="40" y="156" font-size="30" fill="#FFA640" font-weight="600" text-anchor="start">2.0</text><text x="240" y="155" font-size="16" fill="#AEB8BF" font-weight="400" text-anchor="end">s</text><rect x="272" y="94" width="232" height="82" rx="10" fill="#1B2025" stroke="#39434B"/><text x="288" y="118" font-size="14" fill="#AEB8BF" font-weight="600" text-anchor="start">PAUSE FOR</text><text x="288" y="156" font-size="30" fill="#F4F2EC" font-weight="600" text-anchor="start">1.0</text><text x="488" y="155" font-size="16" fill="#AEB8BF" font-weight="400" text-anchor="end">s</text><rect x="520" y="94" width="256" height="82" rx="10" fill="#1B2025" stroke="#39434B"/><text x="536" y="118" font-size="14" fill="#AEB8BF" font-weight="600" text-anchor="start">TARGET SPEED</text><text x="536" y="156" font-size="30" fill="#F4F2EC" font-weight="600" text-anchor="start">0.80</text><text x="760" y="155" font-size="16" fill="#AEB8BF" font-weight="400" text-anchor="end">RPM</text><text x="24" y="211" font-size="14" fill="#AEB8BF" font-weight="600" text-anchor="start">CYCLE PREVIEW</text><rect x="24" y="236" width="120" height="53" rx="4" fill="#393024" stroke="#FFA640"/><text x="84" y="268" font-size="15" fill="#FFA640" font-weight="600" text-anchor="middle">ROTATE</text><rect x="148" y="263" width="60" height="26" rx="4" fill="#252C32"/><rect x="212" y="236" width="120" height="53" rx="4" fill="#393024" stroke="#FFA640"/><text x="272" y="268" font-size="15" fill="#FFA640" font-weight="600" text-anchor="middle">ROTATE</text><rect x="336" y="263" width="60" height="26" rx="4" fill="#252C32"/><rect x="400" y="236" width="120" height="53" rx="4" fill="#393024" stroke="#FFA640"/><text x="460" y="268" font-size="15" fill="#FFA640" font-weight="600" text-anchor="middle">ROTATE</text><rect x="524" y="263" width="60" height="26" rx="4" fill="#252C32"/><rect x="588" y="236" width="120" height="53" rx="4" fill="#393024" stroke="#FFA640"/><text x="648" y="268" font-size="15" fill="#FFA640" font-weight="600" text-anchor="middle">ROTATE</text><rect x="712" y="263" width="60" height="26" rx="4" fill="#252C32"/><text x="24" y="336" font-size="21" fill="#F4F2EC" font-weight="600" text-anchor="start">3.0 s per cycle</text><text x="300" y="336" font-size="19" fill="#AEB8BF" font-weight="400" text-anchor="start">67% on-time</text><text x="776" y="336" font-size="19" fill="#AEB8BF" font-weight="400" text-anchor="end">Continuous repeat</text><path d="M24,392 L776,392" fill="none" stroke="#39434B" stroke-width="1"/><rect x="24" y="408" width="152" height="56" rx="8" fill="#252C32" stroke="#39434B"/><text x="100.0" y="443.0" font-size="19" fill="#F4F2EC" font-weight="600" text-anchor="middle">&lt;  MODES</text><rect x="192" y="408" width="272" height="56" rx="8" fill="#FFA640" stroke="#FFA640"/><te