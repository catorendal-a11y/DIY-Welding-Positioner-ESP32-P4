<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Countdown / armed</title><desc id="desc">Explicitly states that countdown starts continuous motion, not a timed stop. UI design proposal, not live machine data.</desc><g font-family="Bahnschrift, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#101316"/><rect x="0" y="0" width="5" height="66" rx="0" fill="#FFA640"/><text x="24" y="27" font-size="12" fill="#AEB8BF" font-weight="600" text-anchor="start">OPERATION / DELAYED START</text><text x="24" y="54" font-size="25" fill="#F4F2EC" font-weight="600" text-anchor="start">Countdown start</text><rect x="638" y="21" width="138" height="30" rx="15" fill="#1B2025" stroke="#39434B"/><circle cx="653" cy="36" r="4" fill="#FFA640"/><text x="666" y="42" font-size="14" fill="#FFA640" font-weight="600" text-anchor="start">ARMED</text><path d="M24,70 L776,70" fill="none" stroke="#39434B" stroke-width="1"/><text x="24" y="110" font-size="15" fill="#AEB8BF" font-weight="600" text-anchor="start">STARTING IN</text><text x="18" y="260" font-size="150" fill="#FFA640" font-weight="600" text-anchor="start">03</text><text x="230" y="255" font-size="27" fill="#AEB8BF" font-weight="400" text-anchor="start">seconds</text><text x="24" y="324" font-size="20" fill="#F4F2EC" font-weight="400" text-anchor="start">Motor remains disabled until zero.</text><text x="24" y="357" font-size="18" fill="#AEB8BF" font-weight="400" text-anchor="start">STOP cancels the pending start.</text><rect x="424" y="94" width="352" height="280" rx="10" fill="#1B2025"/><text x="444" y="125" font-size="14" fill="#AEB8BF" font-weight="600" text-anchor="start">NEXT ACTION</text><text x="444" y="160" font-size="25" fill="#F4F2EC" font-weight="600" text-anchor="start">Continuous rotation</text><path d="M444,183 L756,183" fill="none" stroke="#39434B" stroke-width="1"/><text x="444" y="221" font-size="14" fill="#AEB8BF" font-weight="600" text-anchor="start">TARGET</text><text x="756" y="221" font-size="22" fill="#F4F2EC" font-weight="400" text-anchor="end">0.80 RPM</text><text x="444" y="272" font-size="14" fill="#AEB8BF" font-weight="600" text-anchor="start">DIRECTION</text><text x="756" y="272" font-size="22" fill="#F4F2EC" font-weight="400" text-anchor="end">CW</text><text x="444" y="345" font-size="18" fill="#FFA640" font-weight="400" text-anchor="start">No automatic stop is set.</text><path d="M24,392 L776,392" fill="none" stroke="#39434B" stroke-width="1"/><rect x="24" y="408" width="152" height="56" rx="8" fill="#252C32" stroke="#39434B"/><text x="100.0" y="443.0" font-size="19" fill="#F4F2EC" font-weight="600" text-anchor="middle">&lt;  MODES</text><rect x="496" y="408" width="280" height="56" rx="8" fill="#3B2025" stroke="#FF7272"/><text x="636.0" y="443.0" font-size="19" fill="#FF7272" font-weight="600" text-anchor="middle">CANCEL START</text></g></svg>