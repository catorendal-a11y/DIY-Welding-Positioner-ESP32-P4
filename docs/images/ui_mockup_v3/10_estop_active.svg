<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Emergency stop / active</title><desc id="desc">Blocking fault view; no start action and reset unavailable while input is active. UI design proposal, not live machine data.</desc><g font-family="Bahnschrift, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#101316"/><rect x="0" y="0" width="5" height="66" rx="0" fill="#FFA640"/><text x="24" y="27" font-size="12" fill="#AEB8BF" font-weight="600" text-anchor="start">SAFETY / MOTION LOCKED</text><text x="24" y="54" font-size="25" fill="#F4F2EC" font-weight="600" text-anchor="start">Emergency stop</text><rect x="638" y="21" width="138" height="30" rx="15" fill="#1B2025" stroke="#39434B"/><circle cx="653" cy="36" r="4" fill="#FF7272"/><text x="666" y="42" font-size="14" fill="#FF7272" font-weight="600" text-anchor="start">LOCKED</text><path d="M24,70 L776,70" fill="none" stroke="#39434B" stroke-width="1"/><rect x="24" y="94" width="752" height="92" rx="10" fill="#3B2025" stroke="#FF7272"/><rect x="42" y="116" width="48" height="48" rx="8" fill="#FF7272"/><text x="66" y="151" font-size="32" fill="#13171A" font-weight="700" text-anchor="middle">!</text><text x="110" y="132" font-size="26" fill="#FF7272" font-weight="600" text-anchor="start">MOTOR OUTPUT DISABLED</text><text x="110" y="165" font-size="18" fill="#F4F2EC" font-weight="400" text-anchor="start">Reset returns to idle. A new start is required.</text><rect x="24" y="206" width="752" height="56" rx="8" fill="#1B2025" stroke="#39434B"/><text x="42" y="240.0" font-size="18" fill="#F4F2EC" font-weight="500" text-anchor="start">Emergency-stop input</text><text x="724" y="240.0" font-size="18" fill="#AEB8BF" font-weight="400" text-anchor="end">ACTIVE</text><text x="754" y="240.0" font-size="20" fill="#FFA640" font-weight="400" text-anchor="middle">!</text><rect x="24" y="274" width="752" height="56" rx="8" fill="#1B2025" stroke="#39434B"/><text x="42" y="308.0" font-size="18" fill="#F4F2EC" font-weight="500" text-anchor="start">Driver alarm</text><text x="724" y="308.0" font-size="18" fill="#AEB8BF" font-weight="400" text-anchor="end">Clear</text><text x="754" y="308.0" font-size="20" fill="#FFA640" font-weight="400" text-anchor="middle">✓</text><text x="24" y="366" font-size="18" fill="#AEB8BF" font-weight="400" text-anchor="start">Release the physical E-STOP, then check the machine.</text><rect x="24" y="408" width="248" height="56" rx="8" fill="#252C32" stroke="#39434B"/><text x="148.0" y="443.0" font-size="19" fill="#F4F2EC" font-weight="600" text-anchor="middle">DIAGNOSTICS</text><rect x="288" y="408" width="488" height="56" rx="8" fill="#1B2025" stroke="#39434B"/><text x="532.0" y="443.0" font-size="19" fill="#7F8A92" font-weight="600" text-anchor="middle">RESET BLOCKED</text></g></svg>