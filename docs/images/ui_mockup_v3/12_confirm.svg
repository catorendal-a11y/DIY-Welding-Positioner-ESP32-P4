<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Confirmation dialog</title><desc id="desc">Specific object and consequence; safe cancel action and labelled destructive action. UI design proposal, not live machine data.</desc><g font-family="Bahnschrift, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#101316"/><rect x="0" y="0" width="5" height="66" rx="0" fill="#FFA640"/><text x="24" y="27" font-size="12" fill="#AEB8BF" font-weight="600" text-anchor="start">PROGRAMS / DELETE</text><text x="24" y="54" font-size="25" fill="#F4F2EC" font-weight="600" text-anchor="start">Confirm action</text><rect x="638" y="21" width="138" height="30" rx="15" fill="#1B2025" stroke="#39434B"/><circle cx="653" cy="36" r="4" fill="#8CE0B0"/><text x="666" y="42" font-size="14" fill="#8CE0B0" font-weight="600" text-anchor="start">READY</text><path d="M24,70 L776,70" fill="none" stroke="#39434B" stroke-width="1"/><rect x="80" y="105" width="640" height="270" rx="12" fill="#1B2025" stroke="#39434B"/><text x="112" y="143" font-size="14" fill="#AEB8BF" font-weight="600" text-anchor="start">DELETE PROGRAM 03</text><text x="112" y="190" font-size="34" fill="#F4F2EC" font-weight="600" text-anchor="start">Delete “Tube Ø300”?</text><text x="112" y="237" font-size="20" fill="#AEB8BF" font-weight="400" text-anchor="start">The saved setup will be permanently removed.</text><text x="112" y="272" font-size="19" fill="#AEB8BF" font-weight="400" text-anchor="start">This does not change motor settings.</text><text x="112" y="336" font-size="18" fill="#FF7272" font-weight="400" text-anchor="start">You cannot undo this action.</text><rect x="24" y="408" width="368" height="56" rx="8" fill="#252C32" stroke="#39434B"/><text x="208.0" y="443.0" font-size="19" fill="#F4F2EC" font-weight="600" text-anchor="middle">KEEP PROGRAM</text><rect x="408" y="408" width="368" height="56" rx="8" fill="#3B2025" stroke="#FF7272"/><text x="592.0" y="443.0" font-size="19" fill="#FF7272" font-weight="600" text-anchor="middle">DELETE PROGRAM</text></g></svg>