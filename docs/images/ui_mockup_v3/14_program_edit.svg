<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Program editor</title><desc id="desc">Named program, explicit mode selection and a separate run-configuration editor. UI design proposal, not live machine data.</desc><g font-family="Bahnschrift, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#101316"/><rect x="0" y="0" width="5" height="66" rx="0" fill="#FFA640"/><text x="24" y="27" font-size="12" fill="#AEB8BF" font-weight="600" text-anchor="start">PROGRAMS / EDIT 03</text><text x="24" y="54" font-size="25" fill="#F4F2EC" font-weight="600" text-anchor="start">Tube Ø300</text><rect x="638" y="21" width="138" height="30" rx="15" fill="#1B2025" stroke="#39434B"/><circle cx="653" cy="36" r="4" fill="#FFA640"/><text x="666" y="42" font-size="14" fill="#FFA640" font-weight="600" text-anchor="start">UNSAVED</text><path d="M24,70 L776,70" fill="none" stroke="#39434B" stroke-width="1"/><rect x="24" y="94" width="752" height="56" rx="8" fill="#1B2025" stroke="#39434B"/><text x="42" y="128.0" font-size="18" fill="#F4F2EC" font-weight="500" text-anchor="start">Program name</text><text x="724" y="128.0" font-size="18" fill="#AEB8BF" font-weight="400" text-anchor="end">Tube Ø300</text><text x="754" y="128.0" font-size="20" fill="#FFA640" font-weight="400" text-anchor="middle">EDIT</text><text x="24" y="182" font-size="14" fill="#AEB8BF" font-weight="600" text-anchor="start">AVAILABLE MODES — TAP TO ENABLE</text><rect x="24" y="198" width="240" height="56" rx="8" fill="#393024" stroke="#FFA640"/><text x="144.0" y="233.0" font-size="19" fill="#FFA640" font-weight="600" text-anchor="middle">CONTINUOUS</text><rect x="280" y="198" width="240" height="56" rx="8" fill="#252C32" stroke="#39434B"/><text x="400.0" y="233.0" font-size="19" fill="#F4F2EC" font-weight="600" text-anchor="middle">PULSE</text><rect x="536" y="198" width="240" height="56" rx="8" fill="#252C32" stroke="#39434B"/><text x="656.0" y="233.0" font-size="19" fill="#F4F2EC" font-weight="600" text-anchor="middle">STEP</text><rect x="24" y="272" width="752" height="56" rx="8" fill="#1B2025" stroke="#39434B"/><text x="42" y="306.0" font-size="18" fill="#F4F2EC" font-weight="500" text-anchor="start">Run configuration</text><text x="724" y="306.0" font-size="18" fill="#AEB8BF" font-weight="400" text-anchor="end">0.80 RPM · CW</text><text x="754" y="306.0" font-size="20" fill="#FFA640" font-weight="400" text-anchor="middle">&gt;</text><text x="24" y="365" font-size="18" fill="#AEB8BF" font-weight="400" text-anchor="start">Continuous is selected as the starting mode.</text><path d="M24,392 L776,392" fill="none" stroke="#39434B" stroke-width="1"/><rect x="24" y="408" width="152" height="56" rx="8" fill="#252C32" stroke="#39434B"/><text x="100.0" y="443.0" font-size="19" fill="#F4F2EC" font-weight="600" text-anchor="middle">&lt;  CANCEL</text><rect x="192" y="408" width="272" height="56" rx="8" fill="#252C32" stroke="#39434B"/><text x="328.0" y="443.0" font-size="19" fill="#F4F2EC" font-weight="600" text-anchor="middle">DELETE</text><rect x="480" y="408" width="296" height="56" rx="8" fill="#FFA640" stroke="#FFA640"/><text x="628.0" y="443.0" font-size="19" fill="#13171A" font-weight="600" text-anchor="middle">SAVE PROGRAM</text></g></svg>