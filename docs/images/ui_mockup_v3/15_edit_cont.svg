<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Edit continuous program</title><desc id="desc">Speed, direction, soft start and a proposed explicit automatic-stop setting. UI design proposal, not live machine data.</desc><g font-family="Bahnschrift, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#101316"/><rect x="0" y="0" width="5" height="66" rx="0" fill="#FFA640"/><text x="24" y="27" font-size="12" fill="#AEB8BF" font-weight="600" text-anchor="start">PROGRAMS / TUBE Ø300</text><text x="24" y="54" font-size="25" fill="#F4F2EC" font-weight="600" text-anchor="start">Continuous settings</text><rect x="638" y="21" width="138" height="30" rx="15" fill="#1B2025" stroke="#39434B"/><circle cx="653" cy="36" r="4" fill="#FFA640"/><text x="666" y="42" font-size="14" fill="#FFA640" font-weight="600" text-anchor="start">EDITING</text><path d="M24,70 L776,70" fill="none" stroke="#39434B" stroke-width="1"/><rect x="24" y="94" width="368" height="82" rx="10" fill="#1B2025" stroke="#FFA640"/><text x="40" y="118" font-size="14" fill="#AEB8BF" font-weight="600" text-anchor="start">TARGET SPEED</text><text x="40" y="156" font-size="30" fill="#FFA640" font-weight="600" text-anchor="start">0.80</text><text x="376" y="155" font-size="16" fill="#AEB8BF" font-weight="400" text-anchor="end">RPM</text><text x="424" y="114" font-size="14" fill="#AEB8BF" font-weight="600" text-anchor="start">DIRECTION</text><rect x="424" y="130" width="168" height="56" rx="8" fill="#393024" stroke="#FFA640"/><text x="508.0" y="165.0" font-size="19" fill="#FFA640" font-weight="600" text-anchor="middle">CW</text><rect x="608" y="130" width="168" height="56" rx="8" fill="#252C32" stroke="#39434B"/><text x="692.0" y="165.0" font-size="19" fill="#F4F2EC" font-weight="600" text-anchor="middle">CCW</text><rect x="24" y="208" width="752" height="64" rx="8" fill="#1B2025" stroke="#39434B"/><text x="42" y="246.0" font-size="18" fill="#F4F2EC" font-weight="500" text-anchor="start">Soft start</text><text x="724" y="246.0" font-size="18" fill="#AEB8BF" font-weight="400" text-anchor="end">ON</text><text x="754" y="246.0" font-size="20" fill="#FFA640" font-weight="400" text-anchor="middle">✓</text><rect x="24" y="288" width="752" height="64" rx="8" fill="#1B2025" stroke="#39434B"/><text x="42" y="326.0" font-size="18" fill="#F4F2EC" font-weight="500" text-anchor="start">Automatic stop</text><text x="724" y="326.0" font-size="18" fill="#AEB8BF" font-weight="400" text-anchor="end">OFF</text><text x="754" y="326.0" font-size="20" fill="#FFA640" font-weight="400" text-anchor="middle">&gt;</text><path d="M24,392 L776,392" fill="none" stroke="#39434B" stroke-width="1"/><rect x="24" y="408" width="152" height="56" rx="8" fill="#252C32" stroke="#39434B"/><text x="100.0" y="443.0" font-size="19" fill="#F4F2EC" font-weight="600" text-anchor="middle">&lt;  CANCEL</text><rect x="496" y="408" width="280" height="56" rx="8" fill="#FFA640" stroke="#FFA640"/><text x="636.0" y="443.0" font-size="19" fill="#13171A" font-weight="600" text-anchor="middle">SAVE SETTINGS</text></g></svg>