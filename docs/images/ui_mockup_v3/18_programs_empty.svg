<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Program library / empty</title><desc id="desc">Purposeful empty state with one clear next action. UI design proposal, not live machine data.</desc><g font-family="Bahnschrift, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#101316"/><rect x="0" y="0" width="5" height="66" rx="0" fill="#FFA640"/><text x="24" y="27" font-size="12" fill="#AEB8BF" font-weight="600" text-anchor="start">PROGRAMS / 0 OF 16 SLOTS</text><text x="24" y="54" font-size="25" fill="#F4F2EC" font-weight="600" text-anchor="start">Welding programs</text><rect x="638" y="21" width="138" height="30" rx="15" fill="#1B2025" stroke="#39434B"/><circle cx="653" cy="36" r="4" fill="#8CE0B0"/><text x="666" y="42" font-size="14" fill="#8CE0B0" font-weight="600" text-anchor="start">READY</text><path d="M24,70 L776,70" fill="none" stroke="#39434B" stroke-width="1"/><rect x="24" y="94" width="752" height="280" rx="10" fill="#1B2025" stroke="#39434B"/><circle cx="400" cy="160" r="32" fill="#393024"/><text x="400" y="174" font-size="42" fill="#FFA640" font-weight="400" text-anchor="middle">+</text><text x="400" y="239" font-size="32" fill="#F4F2EC" font-weight="600" text-anchor="middle">Your next weld, saved.</text><text x="400" y="279" font-size="19" fill="#AEB8BF" font-weight="400" text-anchor="middle">Store speed, direction and cycle settings in one program.</text><text x="400" y="323" font-size="17" fill="#AEB8BF" font-weight="400" text-anchor="middle">Up to 16 programs available.</text><path d="M24,392 L776,392" fill="none" stroke="#39434B" stroke-width="1"/><rect x="24" y="408" width="152" height="56" rx="8" fill="#252C32" stroke="#39434B"/><text x="100.0" y="443.0" font-size="19" fill="#F4F2EC" font-weight="600" text-anchor="middle">&lt;  MENU</text><rect x="496" y="408" width="280" height="56" rx="8" fill="#FFA640" stroke="#FFA640"/><text x="636.0" y="443.0" font-size="19" fill="#13171A" font-weight="600" text-anchor="middle">CREATE FIRST PROGRAM</text></g></svg>