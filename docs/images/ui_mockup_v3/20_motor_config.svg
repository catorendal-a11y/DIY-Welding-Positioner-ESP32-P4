<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Motor configuration</title><desc id="desc">Explicit physical DIP-switch match and stopped-motion apply semantics. UI design proposal, not live machine data.</desc><g font-family="Bahnschrift, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#101316"/><rect x="0" y="0" width="5" height="66" rx="0" fill="#FFA640"/><text x="24" y="27" font-size="12" fill="#AEB8BF" font-weight="600" text-anchor="start">SETUP / MOTION PARAMETERS</text><text x="24" y="54" font-size="25" fill="#F4F2EC" font-weight="600" text-anchor="start">Motor configuration</text><rect x="638" y="21" width="138" height="30" rx="15" fill="#1B2025" stroke="#39434B"/><circle cx="653" cy="36" r="4" fill="#8CE0B0"/><text x="666" y="42" font-size="14" fill="#8CE0B0" font-weight="600" text-anchor="start">READY</text><path d="M24,70 L776,70" fill="none" stroke="#39434B" stroke-width="1"/><rect x="24" y="94" width="240" height="82" rx="10" fill="#1B2025" stroke="#39434B"/><text x="40" y="118" font-size="14" fill="#AEB8BF" font-weight="600" text-anchor="start">DRIVER</text><text x="40" y="156" font-size="30" fill="#F4F2EC" font-weight="600" text-anchor="start">DM542T</text><rect x="280" y="94" width="240" height="82" rx="10" fill="#1B2025" stroke="#39434B"/><text x="296" y="118" font-size="14" fill="#AEB8BF" font-weight="600" text-anchor="start">MICROSTEP</text><text x="296" y="156" font-size="30" fill="#F4F2EC" font-weight="600" text-anchor="start">1 / 16</text><text x="504" y="155" font-size="16" fill="#AEB8BF" font-weight="400" text-anchor="end">3200 / rev</text><rect x="536" y="94" width="240" height="82" rx="10" fill="#1B2025" stroke="#39434B"/><text x="552" y="118" font-size="14" fill="#AEB8BF" font-weight="600" text-anchor="start">MAX SPEED</text><text x="552" y="156" font-size="30" fill="#F4F2EC" font-weight="600" text-anchor="start">3.00</text><text x="760" y="155" font-size="16" fill="#AEB8BF" font-weight="400" text-anchor="end">RPM</text><rect x="24" y="194" width="368" height="82" rx="10" fill="#1B2025" stroke="#39434B"/><text x="40" y="218" font-size="14" fill="#AEB8BF" font-weight="600" text-anchor="start">ACCELERATION</text><text x="40" y="256" font-size="30" fill="#F4F2EC" font-weight="600" text-anchor="start">7500</text><text x="376" y="255" font-size="16" fill="#AEB8BF" font-weight="400" text-anchor="end">steps/s²</text><rect x="408" y="194" width="176" height="82" rx="8" fill="#252C32" stroke="#39434B"/><text x="496.0" y="242.0" font-size="19" fill="#F4F2EC" font-weight="600" text-anchor="middle">INVERT OFF</text><rect x="600" y="194" width="176" height="82" rx="8" fill="#393024" stroke="#FFA640"/><text x="688.0" y="242.0" font-size="19" fill="#FFA640" font-weight="600" text-anchor="middle">DIR SW ON</text><rect x="24" y="296" width="752" height="78" rx="10" fill="#1B2025"/><text x="42" y="327" font-size="19" fill="#FFA640" font-weight="500" text-anchor="start">Match microstepping to the driver DIP switches.</text><text x="42" y="355" font-size="18" fill="#AEB8BF" font-weight="400" text-anchor="start">Changes apply only when motion is stopped.</text><path d="M24,392 L776,392" fill="none" stroke="#39434B" stroke-width="1"/><rect x="24" y="408" width="152" height="56" rx="8" fill="#252C32" stroke="#39434B"/><text x="100.0" y="443.0" font-size="19" fill="#F4F2EC" font-weight="600" text-anchor="middle">&lt;  CANCEL</text><rect x="496" y="408" width="280" height="56" rx="8" fill="#FFA640" stroke="#FFA640"/><text x="636.0" y="443.0" font-size="19" fill="#13171A" font-weight="600" text-anchor="middle">SAVE &amp; APPLY</text></g></svg>