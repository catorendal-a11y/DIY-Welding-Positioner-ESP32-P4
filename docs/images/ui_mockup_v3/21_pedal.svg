<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Pedal settings</title><desc id="desc">Proposed release-to-arm and input-failure interlock; requires firmware changes. UI design proposal, not live machine data.</desc><g font-family="Bahnschrift, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#101316"/><rect x="0" y="0" width="5" height="66" rx="0" fill="#FFA640"/><text x="24" y="27" font-size="12" fill="#AEB8BF" font-weight="600" text-anchor="start">SETUP / OPERATOR INPUT</text><text x="24" y="54" font-size="25" fill="#F4F2EC" font-weight="600" text-anchor="start">Foot pedal</text><rect x="638" y="21" width="138" height="30" rx="15" fill="#1B2025" stroke="#39434B"/><circle cx="653" cy="36" r="4" fill="#FFA640"/><text x="666" y="42" font-size="14" fill="#FFA640" font-weight="600" text-anchor="start">DISARMED</text><path d="M24,70 L776,70" fill="none" stroke="#39434B" stroke-width="1"/><rect x="24" y="94" width="752" height="56" rx="8" fill="#1B2025" stroke="#39434B"/><text x="42" y="128.0" font-size="18" fill="#F4F2EC" font-weight="500" text-anchor="start">Pedal control</text><text x="724" y="128.0" font-size="18" fill="#AEB8BF" font-weight="400" text-anchor="end">OFF</text><text x="754" y="128.0" font-size="20" fill="#FFA640" font-weight="400" text-anchor="middle">&gt;</text><rect x="24" y="162" width="752" height="56" rx="8" fill="#1B2025" stroke="#39434B"/><text x="42" y="196.0" font-size="18" fill="#F4F2EC" font-weight="500" text-anchor="start">Start switch</text><text x="724" y="196.0" font-size="18" fill="#AEB8BF" font-weight="400" text-anchor="end">RELEASED</text><text x="754" y="196.0" font-size="20" fill="#FFA640" font-weight="400" text-anchor="middle">✓</text><rect x="24" y="230" width="752" height="56" rx="8" fill="#1B2025" stroke="#39434B"/><text x="42" y="264.0" font-size="18" fill="#F4F2EC" font-weight="500" text-anchor="start">Analog speed input</text><text x="724" y="264.0" font-size="18" fill="#AEB8BF" font-weight="400" text-anchor="end">CONNECTED</text><text x="754" y="264.0" font-size="20" fill="#FFA640" font-weight="400" text-anchor="middle">✓</text><text x="24" y="329" font-size="21" fill="#F4F2EC" font-weight="500" text-anchor="start">Release the pedal before enabling control.</text><text x="24" y="360" font-size="18" fill="#AEB8BF" font-weight="400" text-anchor="start">Input failure stops pedal-controlled motion.</text><path d="M24,392 L776,392" fill="none" stroke="#39434B" stroke-width="1"/><rect x="24" y="408" width="152" height="56" rx="8" fill="#252C32" stroke="#39434B"/><text x="100.0" y="443.0" font-size="19" fill="#F4F2EC" font-weight="600" text-anchor="middle">&lt;  SETTINGS</text><rect x="496" y="408" width="280" height="56" rx="8" fill="#FFA640" stroke="#FFA640"/><text x="636.0" y="443.0" font-size="19" fill="#13171A" font-weight="600" text-anchor="middle">ENABLE PEDAL</text></g></svg>