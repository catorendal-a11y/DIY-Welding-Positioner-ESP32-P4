<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Calibration / prepare</title><desc id="desc">Guided workpiece calibration with diameter and speed visible before movement. UI design proposal, not live machine data.</desc><g font-family="Bahnschrift, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#101316"/><rect x="0" y="0" width="5" height="66" rx="0" fill="#FFA640"/><text x="24" y="27" font-size="12" fill="#AEB8BF" font-weight="600" text-anchor="start">SETUP / CALIBRATION</text><text x="24" y="54" font-size="25" fill="#F4F2EC" font-weight="600" text-anchor="start">Calibrate rotation</text><rect x="638" y="21" width="138" height="30" rx="15" fill="#1B2025" stroke="#39434B"/><circle cx="653" cy="36" r="4" fill="#8CE0B0"/><text x="666" y="42" font-size="14" fill="#8CE0B0" font-weight="600" text-anchor="start">READY</text><path d="M24,70 L776,70" fill="none" stroke="#39434B" stroke-width="1"/><rect x="24" y="94" width="240" height="44" rx="6" fill="#393024"/><text x="39" y="123" font-size="18" fill="#FFA640" font-weight="600" text-anchor="start">1</text><text x="68" y="123" font-size="18" fill="#F4F2EC" font-weight="400" text-anchor="start">Prepare</text><rect x="280" y="94" width="240" height="44" rx="6" fill="#1B2025"/><text x="295" y="123" font-size="18" fill="#FFA640" font-weight="600" text-anchor="start">2</text><text x="324" y="123" font-size="18" fill="#F4F2EC" font-weight="400" text-anchor="start">Measure</text><rect x="536" y="94" width="240" height="44" rx="6" fill="#1B2025"/><text x="551" y="123" font-size="18" fill="#FFA640" font-weight="600" text-anchor="start">3</text><text x="580" y="123" font-size="18" fill="#F4F2EC" font-weight="400" text-anchor="start">Verify</text><text x="24" y="177" font-size="22" fill="#F4F2EC" font-weight="500" text-anchor="start">Mark the workpiece at its starting position.</text><text x="24" y="211" font-size="18" fill="#AEB8BF" font-weight="400" text-anchor="start">Run one full turn, then enter the measured angle.</text><rect x="24" y="238" width="232" height="82" rx="10" fill="#1B2025" stroke="#39434B"/><text x="40" y="262" font-size="14" fill="#AEB8BF" font-weight="600" text-anchor="start">PART Ø</text><text x="40" y="300" font-size="30" fill="#F4F2EC" font-weight="600" text-anchor="start">300</text><text x="240" y="299" font-size="16" fill="#AEB8BF" font-weight="400" text-anchor="end">mm</text><rect x="272" y="238" width="240" height="82" rx="10" fill="#1B2025" stroke="#39434B"/><text x="288" y="262" font-size="14" fill="#AEB8BF" font-weight="600" text-anchor="start">TEST SPEED</text><text x="288" y="300" font-size="30" fill="#F4F2EC" font-weight="600" text-anchor="start">0.20</text><text x="496" y="299" font-size="16" fill="#AEB8BF" font-weight="400" text-anchor="end">RPM</text><rect x="528" y="238" width="248" height="82" rx="10" fill="#1B2025" stroke="#39434B"/><text x="544" y="262" font-size="14" fill="#AEB8BF" font-weight="600" text-anchor="start">CURRENT FACTOR</text><text x="544" y="300" font-size="30" fill="#F4F2EC" font-weight="600" text-anchor="start">1.0000</text><text x="24" y="363" font-size="18" fill="#FFA640" font-weight="400" text-anchor="start">Saving stays locked until a verification move passes.</text><path d="M24,392 L776,392" fill="none" stroke="#39434B" stroke-width="1"/><rect x="24" y="408" width="152" height="56" rx="8" fill="#252C32" stroke="#39434B"/><text x="100.0" y="443.0" font-size="19" fill="#F4F2EC" font-weight="600" text-anchor="middle">&lt;  SETTINGS</text><rect x="192" y="408" width="272" height="56" rx="8" fill="#FFA640" stroke="#FFA640"/><text x="328.0" y="443.0" font-size="19" fill="#13171A" font-weight="600" text-anchor="middle">MOVE 360°</text><rect x="480" y="408" width="296" height="56" rx="8" fill="#3B2025" stroke="#FF7272"/><text x="628.0" y="443.0" font-size="19" fill="#FF7272" font-weight="600" text-anchor="middle">STOP</text></g></svg>