<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Input diagnostics</title><desc id="desc">Human-readable signal states beside a timestamped event history. UI design proposal, not live machine data.</desc><g font-family="Bahnschrift, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#101316"/><rect x="0" y="0" width="5" height="66" rx="0" fill="#FFA640"/><text x="24" y="27" font-size="12" fill="#AEB8BF" font-weight="600" text-anchor="start">SERVICE / LIVE INPUTS</text><text x="24" y="54" font-size="25" fill="#F4F2EC" font-weight="600" text-anchor="start">Diagnostics</text><rect x="638" y="21" width="138" height="30" rx="15" fill="#1B2025" stroke="#39434B"/><circle cx="653" cy="36" r="4" fill="#8CE0B0"/><text x="666" y="42" font-size="14" fill="#8CE0B0" font-weight="600" text-anchor="start">READY</text><path d="M24,70 L776,70" fill="none" stroke="#39434B" stroke-width="1"/><text x="24" y="110" font-size="14" fill="#AEB8BF" font-weight="600" text-anchor="start">SIGNAL</text><text x="268" y="110" font-size="14" fill="#AEB8BF" font-weight="600" text-anchor="start">STATE</text><text x="408" y="110" font-size="14" fill="#AEB8BF" font-weight="600" text-anchor="start">RECENT EVENTS</text><text x="24" y="154" font-size="18" fill="#F4F2EC" font-weight="400" text-anchor="start">E-STOP</text><text x="352" y="154" font-size="16" fill="#8CE0B0" font-weight="600" text-anchor="end">CLEAR</text><path d="M24,168 L368,168" fill="none" stroke="#39434B" stroke-width="1"/><text x="24" y="200" font-size="18" fill="#F4F2EC" font-weight="400" text-anchor="start">Driver alarm</text><text x="352" y="200" font-size="16" fill="#8CE0B0" font-weight="600" text-anchor="end">CLEAR</text><path d="M24,214 L368,214" fill="none" stroke="#39434B" stroke-width="1"/><text x="24" y="246" font-size="18" fill="#F4F2EC" font-weight="400" text-anchor="start">Pedal switch</text><text x="352" y="246" font-size="16" fill="#AEB8BF" font-weight="600" text-anchor="end">OPEN</text><path d="M24,260 L368,260" fill="none" stroke="#39434B" stroke-width="1"/><text x="24" y="292" font-size="18" fill="#F4F2EC" font-weight="400" text-anchor="start">Direction</text><text x="352" y="292" font-size="16" fill="#AEB8BF" font-weight="600" text-anchor="end">CW</text><path d="M24,306 L368,306" fill="none" stroke="#39434B" stroke-width="1"/><text x="24" y="338" font-size="18" fill="#F4F2EC" font-weight="400" text-anchor="start">Motor output</text><text x="352" y="338" font-size="16" fill="#AEB8BF" font-weight="600" text-anchor="end">DISABLED</text><path d="M24,352 L368,352" fill="none" stroke="#39434B" stroke-width="1"/><rect x="392" y="128" width="384" height="246" rx="10" fill="#1B2025"/><text x="412" y="159" font-size="14" fill="#FFA640" font-weight="400" text-anchor="start">14:32:08</text><text x="412" y="181" font-size="18" fill="#F4F2EC" font-weight="400" text-anchor="start">Stop requested</text><text x="412" y="210" font-size="14" fill="#FFA640" font-weight="400" text-anchor="start">14:32:09</text><text x="412" y="232" font-size="18" fill="#F4F2EC" font-weight="400" text-anchor="start">Motion stopped</text><text x="412" y="261" font-size="14" fill="#FFA640" font-weight="400" text-anchor="start">14:32:09</text><text x="412" y="283" font-size="18" fill="#F4F2EC" font-weight="400" text-anchor="start">Motor disabled</text><text x="412" y="312" font-size="14" fill="#FFA640" font-weight="400" text-anchor="start">14:33:12</text><text x="412" y="334" font-size="18" fill="#F4F2EC" font-weight="400" text-anchor="start">Pedal control off</text><path d="M24,392 L776,392" fill="none" stroke="#39434B" stroke-width="1"/><rect x="24" y="408" width="152" height="56" rx="8" fill="#252C32" stroke="#39434B"/><text x="100.0" y="443.0" font-size="19" fill="#F4F2EC" font-weight="600" text-anchor="middle">&lt;  SETTINGS</text></g></svg>