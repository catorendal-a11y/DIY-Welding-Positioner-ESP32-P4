<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Startup checks</title><desc id="desc">Proposed real readiness checks, not a timed progress animation. UI design proposal, not live machine data.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#192124"/><rect x="0" y="0" width="800" height="76" rx="0" fill="#11191C"/><text x="24" y="22" font-size="14" fill="#B0BBC2" font-weight="700" text-anchor="start">TIG / ROTATOR</text><text x="24" y="59" font-size="26" fill="#F5F5F0" font-weight="700" text-anchor="start">TIG / ROTATOR</text><circle cx="644" cy="38" r="4" fill="#FF6B38"/><text x="656" y="43" font-size="14" fill="#FF6B38" font-weight="700" text-anchor="start">CHECKING</text><text x="24" y="124" font-size="38" fill="#F5F5F0" font-weight="600" text-anchor="start">Ready for</text><text x="24" y="176" font-size="38" fill="#F5F5F0" font-weight="600" text-anchor="start">the next weld.</text><text x="24" y="219" font-size="19" fill="#B0BBC2" font-weight="400" text-anchor="start">Motor output stays disabled</text><text x="24" y="246" font-size="19" fill="#B0BBC2" font-weight="400" text-anchor="start">until initialization is complete.</text><text x="24" y="318" font-size="14" fill="#B0BBC2" font-weight="600" text-anchor="start">CONTROLLER v2.0.9</text><rect x="24" y="344" width="330" height="8" rx="4" fill="#303B40"/><rect x="24" y="344" width="234.29999999999998" height="8" rx="4" fill="#FF6B38"/><text x="24" y="376" font-size="16" fill="#B0BBC2" font-weight="400" text-anchor="start">Initializing controller</text><text x="410" y="121" font-size="18" fill="#F5F5F0" font-weight="400" text-anchor="start">Display &amp; touch</text><text x="754" y="121" font-size="15" fill="#B9F278" font-weight="600" text-anchor="end">OK</text><path d="M410,135 L776,135" fill="none" stroke="#465258" stroke-width="1"/><text x="410" y="177" font-size="18" fill="#F5F5F0" font-weight="400" text-anchor="start">Saved settings</text><text x="754" y="177" font-size="15" fill="#B9F278" font-weight="600" text-anchor="end">OK</text><path d="M410,191 L776,191" fill="none" stroke="#465258" stroke-width="1"/><text x="410" y="233" font-size="18" fill="#F5F5F0" font-weight="400" text-anchor="start">Motor interface</text><text x="754" y="233" font-size="15" fill="#B9F278" font-weight="600" text-anchor="end">OK</text><path d="M410,247 L776,247" fill="none" stroke="#465258" stroke-width="1"/><text x="410" y="289" font-size="18" fill="#F5F5F0" font-weight="400" text-anchor="start">Safety inputs</text><text x="754" y="289" font-size="15" fill="#FF6B38" font-weight="600" text-anchor="end">CHECK</text><path d="M410,303 L776,303" fill="none" stroke="#465258" stroke-width="1"/><text x="410" y="345" font-size="18" fill="#F5F5F0" font-weight="400" text-anchor="start">Pedal released</text><text x="754" y="345" font-size="15" fill="#FF6B38" font-weight="600" text-anchor="end">WAIT</text><path d="M410,359 L776,359" fill="none" stroke="#465258" stroke-width="1"/><text x="24" y="449" font-size="14" fill="#B0BBC2" font-weight="600" text-anchor="start">MOTOR DISABLED</text><text x="776" y="449" font-size="16" fill="#B0BBC2" font-weight="400" text-anchor="end">Do not press the pedal during startup</text></g></svg>