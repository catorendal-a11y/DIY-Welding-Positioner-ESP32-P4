<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Navigation menu</title><desc id="desc">Four clear destinations with fixed return to the main operating screen. UI design proposal, not live machine data.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#192124"/><rect x="0" y="0" width="800" height="76" rx="0" fill="#11191C"/><text x="24" y="22" font-size="14" fill="#B0BBC2" font-weight="700" text-anchor="start">TIG / ROTATOR</text><text x="24" y="59" font-size="26" fill="#F5F5F0" font-weight="700" text-anchor="start">Menu</text><circle cx="644" cy="38" r="4" fill="#B9F278"/><text x="656" y="43" font-size="14" fill="#B9F278" font-weight="700" text-anchor="start">READY</text><rect x="24" y="94" width="368" height="122" rx="16" fill="#252F33" stroke="#465258"/><text x="42" y="125" font-size="14" fill="#FF6B38" font-weight="600" text-anchor="start">01</text><text x="42" y="159" font-size="25" fill="#F5F5F0" font-weight="600" text-anchor="start">Run modes</text><text x="42" y="191" font-size="17" fill="#B0BBC2" font-weight="400" text-anchor="start">Pulse · Step · Jog · Countdown</text><text x="364" y="130" font-size="24" fill="#FF6B38" font-weight="400" text-anchor="start">↗</text><rect x="408" y="94" width="368" height="122" rx="16" fill="#252F33" stroke="#465258"/><text x="426" y="125" font-size="14" fill="#FF6B38" font-weight="600" text-anchor="start">02</text><text x="426" y="159" font-size="25" fill="#F5F5F0" font-weight="600" text-anchor="start">Programs</text><text x="426" y="191" font-size="17" fill="#B0BBC2" font-weight="400" text-anchor="start">Save and repeat your setup</text><text x="748" y="130" font-size="24" fill="#FF6B38" font-weight="400" text-anchor="start">↗</text><rect x="24" y="234" width="368" height="122" rx="16" fill="#252F33" stroke="#465258"/><text x="42" y="265" font-size="14" fill="#FF6B38" font-weight="600" text-anchor="start">03</text><text x="42" y="299" font-size="25" fill="#F5F5F0" font-weight="600" text-anchor="start">Settings</text><text x="42" y="331" font-size="17" fill="#B0BBC2" font-weight="400" text-anchor="start">Motor · Pedal · Display</text><text x="364" y="270" font-size="24" fill="#FF6B38" font-weight="400" text-anchor="start">↗</text><rect x="408" y="234" width="368" height="122" rx="16" fill="#252F33" stroke="#465258"/><text x="426" y="265" font-size="14" fill="#FF6B38" font-weight="600" text-anchor="start">04</text><text x="426" y="299" font-size="25" fill="#F5F5F0" font-weight="600" text-anchor="start">Diagnostics</text><text x="426" y="331" font-size="17" fill="#B0BBC2" font-weight="400" text-anchor="start">Inputs, faults and event log</text><text x="748" y="270" font-size="24" fill="#FF6B38" font-weight="400" text-anchor="start">↗</text><path d="M24,392 L776,392" fill="none" stroke="#465258" stroke-width="1"/><rect x="24" y="408" width="152" height="56" rx="12" fill="#303B40"/><text x="100.0" y="442.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">&lt;  HOME</text></g></svg>