<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Run mode selection</title><desc id="desc">Countdown is labelled as a delayed start rather than a timed-stop mode. UI design proposal, not live machine data.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#192124"/><rect x="0" y="0" width="800" height="76" rx="0" fill="#11191C"/><text x="24" y="22" font-size="14" fill="#B0BBC2" font-weight="700" text-anchor="start">TIG / ROTATOR</text><text x="24" y="59" font-size="26" fill="#F5F5F0" font-weight="700" text-anchor="start">Choose a run mode</text><circle cx="644" cy="38" r="4" fill="#B9F278"/><text x="656" y="43" font-size="14" fill="#B9F278" font-weight="700" text-anchor="start">READY</text><rect x="24" y="94" width="368" height="122" rx="16" fill="#252F33" stroke="#465258"/><text x="42" y="137" font-size="34" fill="#FF6B38" font-weight="600" text-anchor="start">▰</text><text x="102" y="137" font-size="26" fill="#F5F5F0" font-weight="600" text-anchor="start">Pulse</text><text x="42" y="187" font-size="19" fill="#B0BBC2" font-weight="400" text-anchor="start">Rotate, pause, repeat</text><rect x="408" y="94" width="368" height="122" rx="16" fill="#252F33" stroke="#465258"/><text x="426" y="137" font-size="34" fill="#FF6B38" font-weight="600" text-anchor="start">∠</text><text x="486" y="137" font-size="26" fill="#F5F5F0" font-weight="600" text-anchor="start">Step</text><text x="426" y="187" font-size="19" fill="#B0BBC2" font-weight="400" text-anchor="start">Move to a set angle</text><rect x="24" y="234" width="368" height="122" rx="16" fill="#252F33" stroke="#465258"/><text x="42" y="277" font-size="34" fill="#FF6B38" font-weight="600" text-anchor="start">↔</text><text x="102" y="277" font-size="26" fill="#F5F5F0" font-weight="600" text-anchor="start">Jog</text><text x="42" y="327" font-size="19" fill="#B0BBC2" font-weight="400" text-anchor="start">Hold to move</text><rect x="408" y="234" width="368" height="122" rx="16" fill="#252F33" stroke="#465258"/><text x="426" y="277" font-size="34" fill="#FF6B38" font-weight="600" text-anchor="start">3</text><text x="486" y="277" font-size="26" fill="#F5F5F0" font-weight="600" text-anchor="start">Countdown</text><text x="426" y="327" font-size="19" fill="#B0BBC2" font-weight="400" text-anchor="start">Delay a continuous start</text><path d="M24,392 L776,392" fill="none" stroke="#465258" stroke-width="1"/><rect x="24" y="408" width="152" height="56" rx="12" fill="#303B40"/><text x="100.0" y="442.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">&lt;  MENU</text></g></svg>