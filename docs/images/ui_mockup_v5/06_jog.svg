<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Jog / hold to move</title><desc id="desc">Separated direction pads, slow speed control, prominent release-to-stop instruction. UI design proposal, not live machine data.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#192124"/><rect x="0" y="0" width="800" height="76" rx="0" fill="#11191C"/><text x="24" y="22" font-size="14" fill="#B0BBC2" font-weight="700" text-anchor="start">TIG / ROTATOR</text><text x="24" y="59" font-size="26" fill="#F5F5F0" font-weight="700" text-anchor="start">Jog</text><circle cx="644" cy="38" r="4" fill="#B9F278"/><text x="656" y="43" font-size="14" fill="#B9F278" font-weight="700" text-anchor="start">READY</text><rect x="24" y="94" width="304" height="82" rx="16" fill="#252F33"/><text x="40" y="118" font-size="14" fill="#B0BBC2" font-weight="700" text-anchor="start">JOG SPEED</text><text x="40" y="156" font-size="30" fill="#F5F5F0" font-weight="700" text-anchor="start">0.20</text><text x="312" y="155" font-size="14" fill="#B0BBC2" font-weight="400" text-anchor="end">RPM</text><rect x="344" y="94" width="88" height="82" rx="12" fill="#303B40"/><text x="388.0" y="141.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">−</text><rect x="448" y="94" width="88" height="82" rx="12" fill="#303B40"/><text x="492.0" y="141.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">+</text><text x="568" y="128" font-size="16" fill="#FF6B38" font-weight="600" text-anchor="start">RELEASE</text><text x="568" y="155" font-size="21" fill="#F5F5F0" font-weight="600" text-anchor="start">TO STOP</text><rect x="24" y="196" width="368" height="126" rx="12" fill="#303B40"/><text x="208.0" y="265.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">↶  HOLD CCW</text><rect x="408" y="196" width="368" height="126" rx="12" fill="#FF6B38"/><text x="592.0" y="265.0" font-size="17" fill="#11191C" font-weight="700" text-anchor="middle">HOLD CW  ↷</text><text x="24" y="363" font-size="19" fill="#B0BBC2" font-weight="400" text-anchor="start">Motion lasts only while you hold a direction button.</text><path d="M24,392 L776,392" fill="none" stroke="#465258" stroke-width="1"/><rect x="24" y="408" width="152" height="56" rx="12" fill="#303B40"/><text x="100.0" y="442.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">&lt;  MODES</text><rect x="496" y="408" width="280" height="56" rx="12" fill="#B52C35" stroke="#F88589"/><text x="636.0" y="442.0" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">STOP</text></g></svg>