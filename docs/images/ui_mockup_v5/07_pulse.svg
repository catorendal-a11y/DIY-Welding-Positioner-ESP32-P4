<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Pulse setup</title><desc id="desc">Readable timing blocks with an explanatory cycle preview. UI design proposal, not live machine data.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#192124"/><rect x="0" y="0" width="800" height="76" rx="0" fill="#11191C"/><text x="24" y="22" font-size="14" fill="#B0BBC2" font-weight="700" text-anchor="start">TIG / ROTATOR</text><text x="24" y="59" font-size="26" fill="#F5F5F0" font-weight="700" text-anchor="start">Pulse rotation</text><circle cx="644" cy="38" r="4" fill="#B9F278"/><text x="656" y="43" font-size="14" fill="#B9F278" font-weight="700" text-anchor="start">READY</text><rect x="24" y="94" width="232" height="82" rx="16" fill="#FF6B38"/><text x="40" y="118" font-size="14" fill="#49291E" font-weight="700" text-anchor="start">ROTATE FOR</text><text x="40" y="156" font-size="30" fill="#11191C" font-weight="700" text-anchor="start">2.0</text><text x="240" y="155" font-size="14" fill="#49291E" font-weight="400" text-anchor="end">s</text><rect x="272" y="94" width="232" height="82" rx="16" fill="#252F33"/><text x="288" y="118" font-size="14" fill="#B0BBC2" font-weight="700" text-anchor="start">PAUSE FOR</text><text x="288" y="156" font-size="30" fill="#F5F5F0" font-weight="700" text-anchor="start">1.0</text><text x="488" y="155" font-size="14" fill="#B0BBC2" font-weight="400" text-anchor="end">s</text><rect x="520" y="94" width="256" height="82" rx="16" fill="#252F33"/><text x="536" y="118" font-size="14" fill="#B0BBC2" font-weight="700" text-anchor="start">TARGET SPEED</text><text x="536" y="156" font-size="30" fill="#F5F5F0" font-weight="700" text-anchor="start">0.80</text><text x="760" y="155" font-size="14" fill="#B0BBC2" font-weight="400" text-anchor="end">RPM</text><text x="24" y="211" font-size="14" fill="#B0BBC2" font-weight="600" text-anchor="start">CYCLE PREVIEW</text><rect x="24" y="236" width="120" height="53" rx="4" fill="#3B2821" stroke="#FF6B38"/><text x="84" y="268" font-size="15" fill="#FF6B38" font-weight="600" text-anchor="middle">ROTATE</text><rect x="148" y="263" width="60" height="26" rx="4" fill="#303B40"/><rect x="212" y="236" width="120" height="53" rx="4" fill="#3B2821" stroke="#FF6B38"/><text x="272" y="268" font-size="15" fill="#FF6B38" font-weight="600" text-anchor="middle">ROTATE</text><rect x="336" y="263" width="60" height="26" rx="4" fill="#303B40"/><rect x="400" y="236" width="120" height="53" rx="4" fill="#3B2821" stroke="#FF6B38"/><text x="460" y="268" font-size="15" fill="#FF6B38" font-weight="600" text-anchor="middle">ROTATE</text><rect x="524" y="263" width="60" height="26" rx="4" fill="#303B40"/><rect x="588" y="236" width="120" height="53" rx="4" fill="#3B2821" stroke="#FF6B38"/><text x="648" y="268" font-size="15" fill="#FF6B38" font-weight="600" text-anchor="middle">ROTATE</text><rect x="712" y="263" width="60" height="26" rx="4" fill="#303B40"/><text x="24" y="336" font-size="21" fill="#F5F5F0" font-weight="600" text-anchor="start">3.0 s + braking</text><text x="300" y="336" font-size="19" fill="#B0BBC2" font-weight="400" text-anchor="start">67% nominal on-time</text><text x="776" y="336" font-size="19" fill="#B0BBC2" font-weight="400" text-anchor="end">Continuous repeat</text><path d="M24,392 L776,392" fill="none" stroke="#465258" stroke-width="1"/><rect x="24" y="408" width="152" height="56" rx="12" fill="#303B40"/><text x="100.0" y="442.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">&lt;  MODES</text><rect x="192" y="408" width="272" height="56" rx="12" fill="#11191C" stroke="#FF6B38"/><text x="328.0" y="442.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">START PULSE</text><rect x="480" y="408" width="296" height="56" rx="12" fill="#B52C35" stroke="#F88589"/><text x="628.0" y="442.0" font-siz