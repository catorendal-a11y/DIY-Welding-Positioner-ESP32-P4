<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Countdown / armed</title><desc id="desc">Explicitly states that countdown starts continuous motion, not a timed stop. UI design proposal, not live machine data.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#192124"/><rect x="0" y="0" width="800" height="76" rx="0" fill="#11191C"/><text x="24" y="22" font-size="14" fill="#B0BBC2" font-weight="700" text-anchor="start">TIG / ROTATOR</text><text x="24" y="59" font-size="26" fill="#F5F5F0" font-weight="700" text-anchor="start">Countdown start</text><circle cx="644" cy="38" r="4" fill="#FF6B38"/><text x="656" y="43" font-size="14" fill="#FF6B38" font-weight="700" text-anchor="start">ARMED</text><text x="24" y="94" font-size="15" fill="#B0BBC2" font-weight="600" text-anchor="start">STARTING IN</text><text x="18" y="260" font-size="150" fill="#FF6B38" font-weight="600" text-anchor="start">03</text><text x="230" y="255" font-size="27" fill="#B0BBC2" font-weight="400" text-anchor="start">seconds</text><text x="24" y="324" font-size="20" fill="#F5F5F0" font-weight="400" text-anchor="start">Motor remains disabled until zero.</text><text x="24" y="357" font-size="18" fill="#B0BBC2" font-weight="400" text-anchor="start">STOP cancels the pending start.</text><rect x="424" y="94" width="352" height="280" rx="16" fill="#252F33"/><text x="444" y="125" font-size="14" fill="#B0BBC2" font-weight="600" text-anchor="start">NEXT ACTION</text><text x="444" y="160" font-size="25" fill="#F5F5F0" font-weight="600" text-anchor="start">Continuous rotation</text><path d="M444,183 L756,183" fill="none" stroke="#465258" stroke-width="1"/><text x="444" y="221" font-size="14" fill="#B0BBC2" font-weight="600" text-anchor="start">TARGET</text><text x="756" y="221" font-size="22" fill="#F5F5F0" font-weight="400" text-anchor="end">0.80 RPM</text><text x="444" y="272" font-size="14" fill="#B0BBC2" font-weight="600" text-anchor="start">DIRECTION</text><text x="756" y="272" font-size="22" fill="#F5F5F0" font-weight="400" text-anchor="end">CW</text><text x="444" y="345" font-size="18" fill="#FF6B38" font-weight="400" text-anchor="start">No automatic stop is set.</text><path d="M24,392 L776,392" fill="none" stroke="#465258" stroke-width="1"/><rect x="24" y="408" width="152" height="56" rx="12" fill="#303B40"/><text x="100.0" y="442.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">&lt;  MODES</text><rect x="496" y="408" width="280" height="56" rx="12" fill="#B52C35" stroke="#F88589"/><text x="636.0" y="442.0" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">CANCEL START</text></g></svg>