<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Emergency stop / reset allowed</title><desc id="desc">Clear inputs permit reset to idle only, never automatic restart. UI design proposal, not live machine data.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#201619"/><rect x="0" y="0" width="800" height="106" rx="0" fill="#B52C35"/><rect x="24" y="23" width="62" height="62" rx="12" fill="#FFFFFF"/><text x="55" y="69" font-size="40" fill="#B52C35" font-weight="800" text-anchor="middle">!</text><text x="108" y="39" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="start">TIG / ROTATOR — MOTION LOCKED</text><text x="108" y="82" font-size="36" fill="#FFFFFF" font-weight="800" text-anchor="start">EMERGENCY STOP</text><text x="24" y="147" font-size="26" fill="#FFFFFF" font-weight="700" text-anchor="start">MOTOR OUTPUT DISABLED</text><text x="24" y="177" font-size="18" fill="#E3CBCD" font-weight="400" text-anchor="start">Reset returns to idle. It does not start the motor.</text><rect x="24" y="200" width="752" height="62" rx="12" fill="#342328"/><text x="42" y="239" font-size="20" fill="#FFFFFF" font-weight="600" text-anchor="start">Physical E-STOP</text><text x="750" y="239" font-size="22" fill="#B9F278" font-weight="700" text-anchor="end">RELEASED</text><rect x="24" y="274" width="752" height="62" rx="12" fill="#342328"/><text x="42" y="313" font-size="20" fill="#FFFFFF" font-weight="600" text-anchor="start">Driver alarm</text><text x="750" y="313" font-size="22" fill="#B9F278" font-weight="700" text-anchor="end">CLEAR</text><text x="24" y="373" font-size="18" fill="#F4DCDD" font-weight="600" text-anchor="start">Check the machine, then reset the lock.</text><rect x="24" y="408" width="248" height="56" rx="12" fill="#303B40"/><text x="148.0" y="442.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">DIAGNOSTICS</text><rect x="288" y="408" width="488" height="56" rx="12" fill="#F5F5F0"/><text x="532" y="443" font-size="21" fill="#201619" font-weight="700" text-anchor="middle">RESET TO IDLE</text></g></svg>