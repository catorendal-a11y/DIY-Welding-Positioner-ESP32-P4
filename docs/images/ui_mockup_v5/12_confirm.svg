<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Confirmation dialog</title><desc id="desc">Specific object and consequence; safe cancel action and labelled destructive action. UI design proposal, not live machine data.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#192124"/><rect x="0" y="0" width="800" height="76" rx="0" fill="#11191C"/><text x="24" y="22" font-size="14" fill="#B0BBC2" font-weight="700" text-anchor="start">TIG / ROTATOR</text><text x="24" y="59" font-size="26" fill="#F5F5F0" font-weight="700" text-anchor="start">Confirm action</text><circle cx="644" cy="38" r="4" fill="#B9F278"/><text x="656" y="43" font-size="14" fill="#B9F278" font-weight="700" text-anchor="start">READY</text><rect x="80" y="105" width="640" height="270" rx="12" fill="#252F33" stroke="#465258"/><text x="112" y="143" font-size="14" fill="#B0BBC2" font-weight="600" text-anchor="start">DELETE PROGRAM 03</text><text x="112" y="190" font-size="34" fill="#F5F5F0" font-weight="600" text-anchor="start">Delete “Tube Ø300”?</text><text x="112" y="237" font-size="20" fill="#B0BBC2" font-weight="400" text-anchor="start">The saved setup will be permanently removed.</text><text x="112" y="272" font-size="19" fill="#B0BBC2" font-weight="400" text-anchor="start">This does not change motor settings.</text><text x="112" y="336" font-size="18" fill="#FF7770" font-weight="400" text-anchor="start">You cannot undo this action.</text><rect x="24" y="408" width="368" height="56" rx="12" fill="#303B40"/><text x="208.0" y="442.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">KEEP PROGRAM</text><rect x="408" y="408" width="368" height="56" rx="12" fill="#B52C35" stroke="#F88589"/><text x="592.0" y="442.0" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">DELETE PROGRAM</text></g></svg>