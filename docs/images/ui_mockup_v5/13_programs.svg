<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Program library</title><desc id="desc">Select then review before running; edit is separate from start. UI design proposal, not live machine data.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#192124"/><rect x="0" y="0" width="800" height="76" rx="0" fill="#11191C"/><text x="24" y="22" font-size="14" fill="#B0BBC2" font-weight="700" text-anchor="start">TIG / ROTATOR</text><text x="24" y="59" font-size="26" fill="#F5F5F0" font-weight="700" text-anchor="start">Welding programs</text><circle cx="644" cy="38" r="4" fill="#B9F278"/><text x="656" y="43" font-size="14" fill="#B9F278" font-weight="700" text-anchor="start">READY</text><rect x="24" y="94" width="752" height="80" rx="16" fill="#252F33" stroke="#FF6B38"/><text x="42" y="126" font-size="19" fill="#FF6B38" font-weight="600" text-anchor="start">01</text><text x="96" y="126" font-size="23" fill="#F5F5F0" font-weight="600" text-anchor="start">Tube Ø300</text><text x="96" y="154" font-size="16" fill="#B0BBC2" font-weight="400" text-anchor="start">CONTINUOUS  ·  0.80 RPM  ·  CW</text><rect x="652" y="106" width="108" height="56" rx="12" fill="#303B40"/><text x="706.0" y="140.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">EDIT</text><rect x="24" y="188" width="752" height="80" rx="16" fill="#252F33" stroke="#465258"/><text x="42" y="220" font-size="19" fill="#FF6B38" font-weight="600" text-anchor="start">02</text><text x="96" y="220" font-size="23" fill="#F5F5F0" font-weight="600" text-anchor="start">Tack sequence</text><text x="96" y="248" font-size="16" fill="#B0BBC2" font-weight="400" text-anchor="start">STEP  ·  90° × 4  ·  2.0 s dwell</text><rect x="652" y="200" width="108" height="56" rx="12" fill="#303B40"/><text x="706.0" y="234.0" font-size="17" fill="#F5F5F0" font-weight="700" text-