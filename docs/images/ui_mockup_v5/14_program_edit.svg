<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Program editor</title><desc id="desc">Named program, explicit mode selection and a separate run-configuration editor. UI design proposal, not live machine data.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#192124"/><rect x="0" y="0" width="800" height="76" rx="0" fill="#11191C"/><text x="24" y="22" font-size="14" fill="#B0BBC2" font-weight="700" text-anchor="start">TIG / ROTATOR</text><text x="24" y="59" font-size="26" fill="#F5F5F0" font-weight="700" text-anchor="start">Tube Ø300</text><circle cx="644" cy="38" r="4" fill="#FF6B38"/><text x="656" y="43" font-size="14" fill="#FF6B38" font-weight="700" text-anchor="start">UNSAVED</text><rect x="24" y="94" width="752" height="56" rx="8" fill="#252F33" stroke="#465258"/><text x="42" y="128.0" font-size="18" fill="#F5F5F0" font-weight="500" text-anchor="start">Program name</text><text x="698" y="128.0" font-size="18" fill="#B0BBC2" font-weight="400" text-anchor="end">Tube Ø300</text><text x="740" y="128.0" font-size="20" fill="#FF6B38" font-weight="400" text-anchor="middle">EDIT</text><text x="24" y="182" font-size="14" fill="#B0BBC2" font-weight="600" text-anchor="start">AVAILABLE MODES — TAP TO ENABLE</text><rect x="24" y="198" width="240" height="56" rx="12" fill="#FF6B38"/><text x="144.0" y="232.0" font-size="17" fill="#11191C" font-weight="700" text-anchor="middle">CONTINUOUS</text><rect x="280" y="198" width="240" height="56" rx="12" fill="#303B40"/><text x="400.0" y="232.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">PULSE</text><rect x="536" y="198" width="240" height="56" rx="12" fill="#303B40"/><text x="656.0" y="232.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">STEP</text><rect x="24" y="272" width="752" height="56" rx="8" fill="#252F33" stroke="#465258"/><text x="42" y="306.0" font-size="18" fill="#F5F5F0" font-weight="500" text-anchor="start">Run configuration</text><text x="724" y="306.0" font-size="18" fill="#B0BBC2" font-weight="400" text-anchor="end">0.80 RPM · CW</text><text x="754" y="306.0" font-size="20" fill="#FF6B38" font-weight="400" text-anchor="middle">&gt;</text><text x="24" y="365" font-size="18" fill="#B0BBC2" font-weight="400" text-anchor="start">Continuous is selected as the starting mode.</text><path d="M24,392 L776,392" fill="none" stroke="#465258" stroke-width="1"/><rect x="24" y="408" width="152" height="56" rx="12" fill="#303B40"/><text x="100.0" y="442.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">&lt;  CANCEL</text><rect x="192" y="408" width="272" height="56" rx="12" fill="#303B40"/><text x="328.0" y="442.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">DELETE</text><rect x="480" y="408" width="296" height="56" rx="12" fill="#11191C" stroke="#FF6B38"/><text x="628.0" y="442.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">SAVE PROGRAM</text></g></svg>