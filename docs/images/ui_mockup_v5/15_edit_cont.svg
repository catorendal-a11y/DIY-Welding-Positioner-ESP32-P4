<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Edit continuous program</title><desc id="desc">Speed, direction, soft start and a proposed explicit automatic-stop setting. UI design proposal, not live machine data.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#192124"/><rect x="0" y="0" width="800" height="76" rx="0" fill="#11191C"/><text x="24" y="22" font-size="14" fill="#B0BBC2" font-weight="700" text-anchor="start">TIG / ROTATOR</text><text x="24" y="59" font-size="26" fill="#F5F5F0" font-weight="700" text-anchor="start">Continuous settings</text><circle cx="644" cy="38" r="4" fill="#FF6B38"/><text x="656" y="43" font-size="14" fill="#FF6B38" font-weight="700" text-anchor="start">EDITING</text><rect x="24" y="94" width="368" height="82" rx="16" fill="#FF6B38"/><text x="40" y="118" font-size="14" fill="#49291E" font-weight="700" text-anchor="start">TARGET SPEED</text><text x="40" y="156" font-size="30" fill="#11191C" font-weight="700" text-anchor="start">0.80</text><text x="376" y="155" font-size="14" fill="#49291E" font-weight="400" text-anchor="end">RPM</text><text x="424" y="114" font-size="14" fill="#B0BBC2" font-weight="600" text-anchor="start">DIRECTION</text><rect x="424" y="130" width="168" height="56" rx="12" fill="#FF6B38"/><text x="508.0" y="164.0" font-size="17" fill="#11191C" font-weight="700" text-anchor="middle">CW</text><rect x="608" y="130" width="168" height="56" rx="12" fill="#303B40"/><text x="692.0" y="164.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">CCW</text><rect x="24" y="208" width="752" height="64" rx="8" fill="#252F33" stroke="#465258"/><text x="42" y="246.0" font-size="18" fill="#F5F5F0" font-weight="500" text-anchor="start">Soft start</text><text x="724" y="246.0" font-size="18" fill="#B0BBC2" font-weight="400" text-anchor="end">ON</text><text x="754" y="246.0" font-size="20" fill="#FF6B38" font-weight="400" text-anchor="middle">✓</text><rect x="24" y="288" width="752" height="64" rx="8" fill="#252F33" stroke="#465258"/><text x="42" y="326.0" font-size="18" fill="#F5F5F0" font-weight="500" text-anchor="start">Automatic stop</text><text x="724" y="326.0" font-size="18" fill="#B0BBC2" font-weight="400" text-anchor="end">OFF</text><text x="754" y="326.0" font-size="20" fill="#FF6B38" font-weight="400" text-anchor="middle">&gt;</text><path d="M24,392 L776,392" fill="none" stroke="#465258" stroke-width="1"/><rect x="24" y="408" width="152" height="56" rx="12" fill="#303B40"/><text x="100.0" y="442.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">&lt;  CANCEL</text><rect x="496" y="408" width="280" height="56" rx="12" fill="#11191C" stroke="#FF6B38"/><text x="636.0" y="442.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">SAVE SETTINGS</text></g></svg>