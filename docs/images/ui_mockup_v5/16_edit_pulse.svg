ight="82" rx="16" fill="#252F33"/><text x="424" y="218" font-size="14" fill="#B0BBC2" font-weight="700" text-anchor="start">CYCLES</text><text x="424" y="256" font-size="30" fill="#F5F5F0" font-weight="700" text-anchor="start">20</text><text x="760" y="255" font-size="14" fill="#B0BBC2" font-weight="400" text-anchor="end">repeats</text><rect x="24" y="296" width="752" height="78" rx="16" fill="#252F33"/><text x="42" y="322" font-size="14" fill="#B0BBC2" font-weight="600" text-anchor="start">NOMINAL CYCLE TIME</text><text x="42" y="355" font-size="26" fill="#F5F5F0" font-weight="600" text-anchor="start">60 s + ramps</text><text x="752" y="352" font-size="19" fill="#B0BBC2" font-weight="400" text-anchor="end">67% nominal on-time · 3.0 s cycle</text><path d="M24,392 L776,392" fill="none" stroke="#465258" stroke-width="1"/><rect x="24" y="408" width="152" height="56" rx="12" fill="#303B40"/><text x="100.0" y="442.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">&lt;  CANCEL</text><rect x="496" y="408" width="280" height="56" rx="12" fill="#11191C" stroke="#FF6B38"/><text x="636.0" y="442.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">SAVE SETTINGS</text></g></svg>