<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Program library / empty</title><desc id="desc">Purposeful empty state with one clear next action. UI design proposal, not live machine data.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#192124"/><rect x="0" y="0" width="800" height="76" rx="0" fill="#11191C"/><text x="24" y="22" font-size="14" fill="#B0BBC2" font-weight="700" text-anchor="start">TIG / ROTATOR</text><text x="24" y="59" font-size="26" fill="#F5F5F0" font-weight="700" text-anchor="start">Welding programs</text><circle cx="644" cy="38" r="4" fill="#B9F278"/><text x="656" y="43" font-size="14" fill="#B9F278" font-weight="700" text-anchor="start">READY</text><rect x="24" y="94" width="752" height="280" rx="16" fill="#252F33" stroke="#465258"/><circle cx="400" cy="160" r="32" fill="#3B2821"/><text x="400" y="174" font-size="42" fill="#FF6B38" font-weight="400" text-anchor="middle">+</text><text x="400" y="239" font-size="32" fill="#F5F5F0" font-weight="600" text-anchor="middle">Your next weld, saved.</text><text x="400" y="279" font-size="19" fill="#B0BBC2" font-weight="400" text-anchor="middle">Store speed, direction and cycle settings in one program.</text><text x="400" y="323" font-size="17" fill="#B0BBC2" font-weight="400" text-anchor="middle">Up to 16 programs available.</text><path d="M24,392 L776,392" fill="none" stroke="#465258" stroke-width="1"/><rect x="24" y="408" width="152" height="56" rx="12" fill="#303B40"/><text x="100.0" y="442.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">&lt;  MENU</text><rect x="496" y="408" width="280" height="56" rx="12" fill="#11191C" stroke="#FF6B38"/><text x="636.0" y="442.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">CREATE FIRST PROGRAM</text></g></svg>