<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Motor configuration</title><desc id="desc">Explicit physical DIP-switch match and stopped-motion apply semantics. UI design proposal, not live machine data.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#192124"/><rect x="0" y="0" width="800" height="76" rx="0" fill="#11191C"/><text x="24" y="22" font-size="14" fill="#B0BBC2" font-weight="700" text-anchor="start">TIG / ROTATOR</text><text x="24" y="59" font-size="26" fill="#F5F5F0" font-weight="700" text-anchor="start">Motor configuration</text><circle cx="644" cy="38" r="4" fill="#B9F278"/><text x="656" y="43" font-size="14" fill="#B9F278" font-weight="700" text-anchor="start">READY</text><rect x="24" y="94" width="240" height="82" rx="16" fill="#252F33"/><text x="40" y="118" font-size="14" fill="#B0BBC2" font-weight="700" text-anchor="start">DRIVER</text><text x="40" y="156" font-size="30" fill="#F5F5F0" font-weight="700" text-anchor="start">DM542T</text><rect x="280" y="94" width="240" height="82" rx="16" fill="#252F33"/><text x="296" y="118" font-size="14" fill="#B0BBC2" font-weight="700" text-anchor="start">MICROSTEP</text><text x="296" y="156" font-size="30" fill="#F5F5F0" font-weight="700" text-anchor="start">1 / 16</text><text x="504" y="155" font-size="14" fill="#B0BBC2" font-weight="400" text-anchor="end">3200 / rev</text><rect x="536" y="94" width="240" height="82" rx="16" fill="#252F33"/><text x="552" y="118" font-size="14" fill="#B0BBC2" font-weight="700" text-anchor="start">MAX SPEED</text><text x="552" y="156" font-size="30" fill="#F5F5F0" font-weight="700" text-anchor="start">3.00</text><text x="760" y="155" font-size="14" fill="#B0BBC2" font-weight="400" text-anchor="end">RPM</text><rect x="24" y="194" width="368" height="82" rx="16" fill="#252F33"/><text x="40" y="218" font-size="14" fill="#B0BBC2" font-weight="700" text-anchor="start">ACCELERATION</text><text x="40" y="256" font-size="30" fill="#F5F5F0" font-weight="700" text-anchor="start">7500</text><text x="376" y="255" font-size="14" fill="#B0BBC2" font-weight="400" text-anchor="end">steps/s²</text><rect x="408" y="194" width="176" height="82" rx="12" fill="#303B40"/><text x="496.0" y="241.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">INVERT OFF</text><rect x="600" y="194" width="176" height="82" rx="12" fill="#FF6B38"/><text x="688.0" y="241.0" font-size="17" fill="#11191C" font-weight="700" text-anchor="middle">DIR SW ON</text><rect x="24" y="296" width="752" height="78" rx="16" fill="#252F33"/><text x="42" y="327" font-size="19" fill="#FF6B38" font-weight="500" text-anchor="start">Match microstepping to the driver DIP switches.</text><text x="42" y="355" font-size="18" fill="#B0BBC2" font-weight="400" text-anchor="start">Changes apply only when motion is stopped.</text><path d="M24,392 L776,392" fill="none" stroke="#465258" stroke-width="1"/><rect x="24" y="408" width="152" height="56" rx="12" fill="#303B40"/><text x="100.0" y="442.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">&lt;  CANCEL</text><rect x="496" y="408" width="280" height="56" rx="12" fill="#11191C" stroke="#FF6B38"/><text x="636.0" y="442.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">SAVE &amp; APPLY</text></g></svg>