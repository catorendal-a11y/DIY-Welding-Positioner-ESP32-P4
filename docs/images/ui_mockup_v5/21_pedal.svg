<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Pedal settings</title><desc id="desc">Proposed release-to-arm and input-failure interlock; requires firmware changes. UI design proposal, not live machine data.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#192124"/><rect x="0" y="0" width="800" height="76" rx="0" fill="#11191C"/><text x="24" y="22" font-size="14" fill="#B0BBC2" font-weight="700" text-anchor="start">TIG / ROTATOR</text><text x="24" y="59" font-size="26" fill="#F5F5F0" font-weight="700" text-anchor="start">Foot pedal</text><circle cx="644" cy="38" r="4" fill="#FF6B38"/><text x="656" y="43" font-size="14" fill="#FF6B38" font-weight="700" text-anchor="start">DISARMED</text><rect x="24" y="94" width="752" height="56" rx="8" fill="#252F33" stroke="#465258"/><text x="42" y="128.0" font-size="18" fill="#F5F5F0" font-weight="500" text-anchor="start">Pedal control</text><text x="724" y="128.0" font-size="18" fill="#B0BBC2" font-weight="400" text-anchor="end">OFF</text><text x="754" y="128.0" font-size="20" fill="#FF6B38" font-weight="400" text-anchor="middle">&gt;</text><rect x="24" y="162" width="752" height="56" rx="8" fill="#252F33" stroke="#465258"/><text x="42" y="196.0" font-size="18" fill="#F5F5F0" font-weight="500" text-anchor="start">Start switch</text><text x="724" y="196.0" font-size="18" fill="#B0BBC2" font-weight="400" text-anchor="end">RELEASED</text><text x="754" y="196.0" font-size="20" fill="#FF6B38" font-weight="400" text-anchor="middle">✓</text><rect x="24" y="230" width="752" height="56" rx="8" fill="#252F33" stroke="#465258"/><text x="42" y="264.0" font-size="18" fill="#F5F5F0" font-weight="500" text-anchor="start">Analog speed input</text><text x="724" y="264.0" font-size="18" fill="#B0BBC2" font-weight="400" text-anchor="end">CONNECTED</text><text x="754" y="264.0" font-size="20" fill="#FF6B38" font-weight="400" text-anchor="middle">✓</text><text x="24" y="329" font-size="21" fill="#F5F5F0" font-weight="500" text-anchor="start">Release the pedal before enabling control.</text><text x="24" y="360" font-size="18" fill="#B0BBC2" font-weight="400" text-anchor="start">Input failure stops pedal-controlled motion.</text><path d="M24,392 L776,392" fill="none" stroke="#465258" stroke-width="1"/><rect x="24" y="408" width="152" height="56" rx="12" fill="#303B40"/><text x="100.0" y="442.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">&lt;  SETTINGS</text><rect x="496" y="408" width="280" height="56" rx="12" fill="#11191C" stroke="#FF6B38"/><text x="636.0" y="442.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">ENABLE PEDAL</text></g></svg>