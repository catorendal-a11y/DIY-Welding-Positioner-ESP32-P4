<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Calibration / prepare</title><desc id="desc">Guided workpiece calibration with diameter and speed visible before movement. UI design proposal, not live machine data.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#192124"/><rect x="0" y="0" width="800" height="76" rx="0" fill="#11191C"/><text x="24" y="22" font-size="14" fill="#B0BBC2" font-weight="700" text-anchor="start">TIG / ROTATOR</text><text x="24" y="59" font-size="26" fill="#F5F5F0" font-weight="700" text-anchor="start">Calibrate rotation</text><circle cx="644" cy="38" r="4" fill="#B9F278"/><text x="656" y="43" font-size="14" fill="#B9F278" font-weight="700" text-anchor="start">READY</text><rect x="24" y="94" width="240" height="44" rx="6" fill="#3B2821"/><text x="39" y="123" font-size="18" fill="#FF6B38" font-weight="600" text-anchor="start">1</text><text x="68" y="123" font-size="18" fill="#F5F5F0" font-weight="400" text-anchor="start">Prepare</text><rect x="280" y="94" width="240" height="44" rx="6" fill="#252F33"/><text x="295" y="123" font-size="18" fill="#FF6B38" font-weight="600" text-anchor="start">2</text><text x="324" y="123" font-size="18" fill="#F5F5F0" font-weight="400" text-anchor="start">Measure</text><rect x="536" y="94" width="240" height="44" rx="6" fill="#252F33"/><text x="551" y="123" font-size="18" fill="#FF6B38" font-weight="600" text-anchor="start">3</text><text x="580" y="123" font-size="18" fill="#F5F5F0" font-weight="400" text-anchor="start">Verify</text><text x="24" y="177" font-size="22" fill="#F5F5F0" font-weight="500" text-anchor="start">Mark the workpiece at its starting position.</text><text x="24" y="211" font-size="18" fill="#B0BBC2" font-weight="400" text-anchor="start">Run one full turn, then enter the measured angle.</text><rect x="24" y="238" width="232" height="82" rx="16" fill="#252F33"/><text x="40" y="262" font-size="14" fill="#B0BBC2" font-weight="700" text-anchor="start">PART Ø</text><text x="40" y="300" font-size="30" fill="#F5F5F0" font-weight="700" text-anchor="start">300</text><text x="240" y="299" font-size="14" fill="#B0BBC2" font-weight="400" text-anchor="end">mm</text><rect x="272" y="238" width="240" height="82" rx="16" fill="#252F33"/><text x="288" y="262" font-size="14" fill="#B0BBC2" font-weight="700" text-anchor="start">TEST SPEED</text><text x="288" y="300" font-size="30" fill="#F5F5F0" font-weight="700" text-anchor="start">0.20</text><text x="496" y="299" font-size="14" fill="#B0BBC2" font-weight="400" text-anchor="end">RPM</text><rect x="528" y="238" width="248" height="82" rx="16" fill="#252F33"/><text x="544" y="262" font-size="14" fill="#B0BBC2" font-weight="700" text-anchor="start">CURRENT FACTOR</text><text x="544" y="300" font-size="30" fill="#F5F5F0" font-weight="700" text-anchor="start">1.0000</text><text x="24" y="363" font-size="18" fill="#FF6B38" font-weight="400" text-anchor="start">Saving stays locked until a verification move passes.</text><path d="M24,392 L776,392" fill="none" stroke="#465258" stroke-width="1"/><rect x="24" y="408" width="152" height="56" rx="12" fill="#303B40"/><text x="100.0" y="442.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">&lt;  SETTINGS</text><rect x="192" y="408" width="272" height="56" rx="12" fill="#11191C" stroke="#FF6B38"/><text x="328.0" y="442.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">MOVE 360°</text><rect x="480" y="408" width="296" height="56" rx="12" fill="#B52C35" stroke="#F88589"/><text x="628.0" y="442.0" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">STOP</text></g></svg>