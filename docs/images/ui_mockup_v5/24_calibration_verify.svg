<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Calibration / verification</title><desc id="desc">Measured angle, explicit tolerance and save gate; values are illustrative. UI design proposal, not live machine data.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#192124"/><rect x="0" y="0" width="800" height="76" rx="0" fill="#11191C"/><text x="24" y="22" font-size="14" fill="#B0BBC2" font-weight="700" text-anchor="start">TIG / ROTATOR</text><text x="24" y="59" font-size="26" fill="#F5F5F0" font-weight="700" text-anchor="start">Calibrate rotation</text><circle cx="644" cy="38" r="4" fill="#B9F278"/><text x="656" y="43" font-size="14" fill="#B9F278" font-weight="700" text-anchor="start">VERIFIED</text><rect x="24" y="94" width="240" height="44" rx="6" fill="#252F33"/><text x="39" y="123" font-size="18" fill="#FF6B38" font-weight="600" text-anchor="start">1</text><text x="68" y="123" font-size="18" fill="#F5F5F0" font-weight="400" text-anchor="start">Prepare</text><rect x="280" y="94" width="240" height="44" rx="6" fill="#252F33"/><text x="295" y="123" font-size="18" fill="#FF6B38" font-weight="600" text-anchor="start">2</text><text x="324" y="123" font-size="18" fill="#F5F5F0" font-weight="400" text-anchor="start">Measure</text><rect x="536" y="94" width="240" height="44" rx="6" fill="#3B2821"/><text x="551" y="123" font-size="18" fill="#FF6B38" font-weight="600" text-anchor="start">3</text><text x="580" y="123" font-size="18" fill="#F5F5F0" font-weight="400" text-anchor="start">Verify</text><rect x="24" y="158" width="368" height="82" rx="16" fill="#252F33"/><text x="40" y="182" font-size="14" fill="#B0BBC2" font-weight="700" text-anchor="start">VERIFICATION RESULT</text><text x="40" y="220" font-size="30" fill="#F5F5F0" font-weight="700" text-anchor="start">359.8</text><text x="376" y="219" font-size="14" fill="#B0BBC2" font-weight="400" text-anchor="end">degrees</text><rect x="408" y="158" width="368" height="82" rx="16" fill="#252F33"/><text x="424" y="182" font-size="14" fill="#B0BBC2" font-weight="700" text-anchor="start">ANGLE ERROR</text><text x="424" y="220" font-size="30" fill="#F5F5F0" font-weight="700" text-anchor="start">−0.2</text><text x="760" y="219" font-size="14" fill="#B0BBC2" font-weight="400" text-anchor="end">degrees</text><rect x="24" y="260" width="752" height="114" rx="16" fill="#252F33"/><text x="42" y="297" font-size="25" fill="#B9F278" font-weight="600" text-anchor="start">PASS · within ±1.0° tolerance</text><text x="42" y="333" font-size="19" fill="#F5F5F0" font-weight="400" text-anchor="start">New factor 1.0056 is ready to save.</text><text x="42" y="360" font-size="16" fill="#B0BBC2" font-weight="400" text-anchor="start">Calculated from the measured workpiece angle.</text><path d="M24,392 L776,392" fill="none" stroke="#465258" stroke-width="1"/><rect x="24" y="408" width="152" height="56" rx="12" fill="#303B40"/><text x="100.0" y="442.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">&lt;  BACK</text><rect x="192" y="408" width="272" height="56" rx="12" fill="#303B40"/><text x="328.0" y="442.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">VERIFY AGAIN</text><rect x="480" y="408" width="296" height="56" rx="12" fill="#11191C" stroke="#FF6B38"/><text x="628.0" y="442.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">SAVE CALIBRATION</text></g></svg>