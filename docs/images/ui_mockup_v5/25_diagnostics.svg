<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Input diagnostics</title><desc id="desc">Human-readable signal states beside a timestamped event history. UI design proposal, not live machine data.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#192124"/><rect x="0" y="0" width="800" height="76" rx="0" fill="#11191C"/><text x="24" y="22" font-size="14" fill="#B0BBC2" font-weight="700" text-anchor="start">TIG / ROTATOR</text><text x="24" y="59" font-size="26" fill="#F5F5F0" font-weight="700" text-anchor="start">Diagnostics</text><circle cx="644" cy="38" r="4" fill="#B9F278"/><text x="656" y="43" font-size="14" fill="#B9F278" font-weight="700" text-anchor="start">READY</text><text x="24" y="110" font-size="14" fill="#B0BBC2" font-weight="600" text-anchor="start">SIGNAL</text><text x="268" y="110" font-size="14" fill="#B0BBC2" font-weight="600" text-anchor="start">STATE</text><text x="408" y="110" font-size="14" fill="#B0BBC2" font-weight="600" text-anchor="start">RECENT EVENTS</text><text x="24" y="154" font-size="18" fill="#F5F5F0" font-weight="400" text-anchor="start">E-STOP</text><text x="352" y="154" font-size="16" fill="#B9F278" font-weight="600" text-anchor="end">CLEAR</text><path d="M24,168 L368,168" fill="none" stroke="#465258" stroke-width="1"/><text x="24" y="200" font-size="18" fill="#F5F5F0" font-weight="400" text-anchor="start">Driver alarm</text><text x="352" y="200" font-size="16" fill="#B9F278" font-weight="600" text-anchor="end">CLEAR</text><path d="M24,214 L368,214" fill="none" stroke="#465258" stroke-width="1"/><text x="24" y="246" font-size="18" fill="#F5F5F0" font-weight="400" text-anchor="start">Pedal switch</text><text x="352" y="246" font-size="16" fill="#B0BBC2" font-weight="600" text-anchor="end">OPEN</text><path d="M24,260 L368,260" fill="none" stroke="#465258" stroke-width="1"/><text x="24" y="292" font-size="18" fill="#F5F5F0" font-weight="400" text-anchor="start">Direction</text><text x="352" y="292" font-size="16" fill="#B0BBC2" font-weight="600" text-anchor="end">CW</text><path d="M24,306 L368,306" fill="none" stroke="#465258" stroke-width="1"/><text x="24" y="338" font-size="18" fill="#F5F5F0" font-weight="400" text-anchor="start">Motor output</text><text x="352" y="338" font-size="16" fill="#B0BBC2" font-weight="600" text-anchor="end">DISABLED</text><path d="M24,352 L368,352" fill="none" stroke="#465258" stroke-width="1"/><rect x="392" y="128" width="384" height="246" rx="16" fill="#252F33"/><text x="412" y="159" font-size="14" fill="#FF6B38" font-weight="400" text-anchor="start">14:32:08</text><text x="412" y="181" font-size="18" fill="#F5F5F0" font-weight="400" text-anchor="start">Stop requested</text><text x="412" y="210" font-size="14" fill="#FF6B38" font-weight="400" text-anchor="start">14:32:09</text><text x="412" y="232" font-size="18" fill="#F5F5F0" font-weight="400" text-anchor="start">Motion stopped</text><text x="412" y="261" font-size="14" fill="#FF6B38" font-weight="400" text-anchor="start">14:32:09</text><text x="412" y="283" font-size="18" fill="#F5F5F0" font-weight="400" text-anchor="start">Motor disabled</text><text x="412" y="312" font-size="14" fill="#FF6B38" font-weight="400" text-anchor="start">14:33:12</text><text x="412" y="334" font-size="18" fill="#F5F5F0" font-weight="400" text-anchor="start">Pedal control off</text><path d="M24,392 L776,392" fill="none" stroke="#465258" stroke-width="1"/><rect x="24" y="408" width="152" height="56" rx="12" fill="#303B40"/><text x="100.0" y="442.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">&lt;  SETTINGS</text></g></svg>