<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Numeric input</title><desc id="desc">Full-size keypad, units, valid range and an explicit apply action. UI design proposal, not live machine data.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="480" rx="0" fill="#192124"/><rect x="0" y="0" width="800" height="76" rx="0" fill="#11191C"/><text x="24" y="22" font-size="14" fill="#B0BBC2" font-weight="700" text-anchor="start">TIG / ROTATOR</text><text x="24" y="59" font-size="26" fill="#F5F5F0" font-weight="700" text-anchor="start">Set target speed</text><circle cx="644" cy="38" r="4" fill="#FF6B38"/><text x="656" y="43" font-size="14" fill="#FF6B38" font-weight="700" text-anchor="start">EDITING</text><rect x="24" y="94" width="272" height="82" rx="16" fill="#FF6B38"/><text x="40" y="118" font-size="14" fill="#49291E" font-weight="700" text-anchor="start">TARGET SPEED</text><text x="40" y="156" font-size="30" fill="#11191C" font-weight="700" text-anchor="start">0.80</text><text x="280" y="155" font-size="14" fill="#49291E" font-weight="400" text-anchor="end">RPM</text><text x="24" y="214" font-size="18" fill="#B0BBC2" font-weight="400" text-anchor="start">Allowed range</text><text x="24" y="247" font-size="22" fill="#F5F5F0" font-weight="600" text-anchor="start">0.001–3.000 RPM</text><text x="24" y="306" font-size="18" fill="#B0BBC2" font-weight="400" text-anchor="start">Changes apply after</text><text x="24" y="334" font-size="18" fill="#B0BBC2" font-weight="400" text-anchor="start">you tap APPLY.</text><rect x="328" y="94" width="144" height="64" rx="12" fill="#303B40"/><text x="400.0" y="132.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">7</text><rect x="480" y="94" width="144" height="64" rx="12" fill="#303B40"/><text x="552.0" y="132.0" font-size="17" fill="#F5F5F0" font-weight="700" text-anchor="middle">8<